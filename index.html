      .img-adjust-slider::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);cursor:pointer;}
      .image-upload-btn{display:inline-block;cursor:pointer;-webkit-tap-highlight-color:transparent;margin-top:4px;}
      .crop-box-wrap{margin-top:4px;}
      .crop-box-frame{position:relative;width:100%;height:150px;overflow:hidden;background:var(--bg3);border:1px solid var(--gold);cursor:grab;touch-action:none;user-select:none;}
      .crop-box-frame:active{cursor:grabbing;}
      .crop-box-frame img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
      .crop-box-hint{position:absolute;bottom:6px;right:8px;font-size:9px;letter-spacing:0.5px;color:rgba(240,232,220,0.85);background:rgba(0,0,0,0.5);padding:3px 7px;pointer-events:none;}
      .crop-box-zoom-row{display:flex;align-items:center;gap:10px;margin-top:8px;}
      .crop-box-zoom-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);flex-shrink:0;}
      .bean-hero-content{padding:14px 16px 12px;overflow:hidden;}
      .bean-title{font-family:'Playfair Display',serif;font-size:24px;color:var(--gold);line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .bean-roaster-lbl{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:3px;}
      .bean-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
      .roast-date{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;}
      .roast-date-exact{color:var(--dim);}
      .fresh-badge{font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:1px 6px;border:1px solid;border-radius:2px;}
      .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
      .pill{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text3);border:1px solid var(--border);padding:3px 8px;}
      .rating-wrap{margin-top:10px;}
      .rating-stars{display:flex;gap:3px;margin-bottom:3px;}
      .star-c{position:relative;font-size:20px;}
      .star-bg{color:var(--dim);}
      .star-fg{position:absolute;left:0;top:0;overflow:hidden;color:var(--gold);white-space:nowrap;}
      .rating-val{font-size:12px;color:var(--text3);margin-bottom:5px;}
      .rating-slider{-webkit-appearance:none;appearance:none;width:100%;height:3px;background:var(--border);outline:none;border-radius:2px;}
      .rating-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);cursor:pointer;}
      .method-row{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0;}
      .method-row::-webkit-scrollbar{display:none;}
      .method-btn{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:10px 15px;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;border:none;background:none;border-bottom:2px solid transparent;}
      .method-btn.active{color:var(--gold);border-bottom-color:var(--gold);}
      .tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0;}
      .tabs::-webkit-scrollbar{display:none;}
      .tab{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;padding:9px 13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;-webkit-tap-highlight-color:transparent;flex-shrink:0;border:none;background:none;border-bottom:2px solid transparent;}
      .tab.active{color:var(--gold);border-bottom-color:var(--gold);}
      .tc{padding:16px 16px 80px;width:100%;box-sizing:border-box;}
      .div{height:1px;background:var(--border);margin:16px 0;}
      .pg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:14px;width:100%;}
      .pm{background:var(--bg3);border:1px solid var(--border);padding:12px 13px;position:relative;cursor:pointer;min-width:0;}
      .pm:active{border-color:var(--text3);}
      .pm.w{grid-column:span 2;}
      .pm-lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
      .pm-val{font-size:21px;color:var(--text);font-weight:500;line-height:1.1;}
      .pm-val.sm{font-size:14px;}
      .pm-unit{font-size:11px;color:var(--muted);margin-left:2px;}
      .param-dd{position:absolute;top:100%;left:0;right:0;background:var(--bg2);border:1px solid var(--gold);z-index:50;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.8);}
      .export-menu-backdrop{position:fixed;inset:0;z-index:49;background:transparent;}
      .export-menu{position:fixed;top:52px;right:15px;background:var(--bg2);border:1px solid var(--gold);z-index:50;min-width:200px;box-shadow:0 8px 24px rgba(0,0,0,.8);}
      .export-menu-item{display:flex;flex-direction:column;align-items:flex-start;width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text2);font-family:'DM Mono',monospace;font-size:12px;padding:10px 12px;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;}
      .export-menu-item:last-child{border-bottom:none;}
      .export-menu-item:active{background:var(--bg3);color:var(--gold);}
      .export-menu-sub{font-size:9px;color:var(--muted);margin-top:2px;}
      .param-opts{display:flex;flex-direction:column;gap:2px;max-height:180px;overflow-y:auto;margin-bottom:6px;}
      .param-opt{font-family:'DM Mono',monospace;font-size:14px;padding:9px 10px;text-align:left;background:transparent;border:1px solid transparent;color:var(--text2);cursor:pointer;-webkit-tap-highlight-color:transparent;}
      .param-opt:active{background:var(--bg3);color:var(--gold);}
      .param-opt.sel{color:var(--gold);}
      .param-opt.custom-opt{color:var(--muted);border-top:1px solid var(--border);margin-top:4px;padding-top:8px;}
      .param-custom{display:flex;flex-direction:column;}
      .param-custom-input{font-family:'DM Mono',monospace;font-size:18px;background:var(--bg3);border:1px solid var(--gold);color:var(--text);padding:8px 10px;outline:none;-webkit-appearance:none;border-radius:0;}
      .param-close{position:absolute;top:4px;right:6px;background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px;}
      .grind-inline{background:var(--bg3);border:1px solid var(--border);padding:12px 13px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
      .start-point-box{background:#1e1628;border:1px solid #4a3a6a;padding:14px;margin-bottom:14px;}
      .gi-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:3px;}
      .gi-val{font-size:27px;color:var(--gold);letter-spacing:3px;font-weight:500;}
      .gi-sub{font-size:12px;color:var(--muted);margin-top:3px;}
      .gi-none{font-size:13px;color:var(--dim);}
      .sec{margin-bottom:13px;}
      .sec-lbl{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
      .sec-txt{font-size:15px;color:var(--text2);line-height:1.75;}
      .saved-recipe{background:var(--bg3);border:1px solid var(--border);padding:13px;margin-bottom:10px;}
      .saved-recipe-date{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
      .saved-recipe-text{font-size:14px;color:var(--text2);line-height:1.7;white-space:pre-wrap;margin-bottom:8px;}
      .grind-groups{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;}
      .grind-group{display:flex;gap:2px;margin-bottom:2px;}
      .grind-pos{font-family:'DM Mono',monospace;font-size:13px;padding:7px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);cursor:pointer;min-width:34px;text-align:center;-webkit-tap-highlight-color:transparent;}
      .grind-pos.whole{border-color:#4a3a28;color:var(--text3);font-weight:500;}
      .grind-pos.active{background:#2a1e0a;border-color:var(--gold);color:var(--gold);}
      .gl{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
      .ge{background:var(--bg3);border:1px solid var(--border);padding:11px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
      .ge-pos{font-size:23px;color:var(--gold);letter-spacing:3px;font-weight:500;}
      .ge-date{font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-top:3px;}
      .ge-note{font-size:13px;color:var(--text3);margin-top:4px;line-height:1.5;}
      .ge-badge{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);border:1px solid #3a5a28;padding:2px 6px;margin-top:3px;display:inline-block;}
      .ga-form{background:var(--bg3);border:1px solid var(--border);padding:13px;margin-bottom:13px;}
      .empty-grind{padding:16px;text-align:center;color:#4a3a28;font-size:13px;border:1px dashed var(--border);margin-bottom:13px;}
      .fg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:13px;width:100%;}
      .field{display:flex;flex-direction:column;gap:4px;min-width:0;}
      .field label{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
      .field input,.field textarea{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:18px;padding:9px 11px;outline:none;resize:vertical;-webkit-appearance:none;border-radius:0;width:100%;min-width:0;}
      .field input:focus,.field textarea:focus{border-color:var(--gold);}
      .field.full{grid-column:1/-1;}
      .sel-input{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:18px;padding:9px 11px;outline:none;-webkit-appearance:none;border-radius:0;width:100%;min-width:0;}
      .fa{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
      .toggle-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);font-family:'DM Mono',monospace;font-size:15px;padding:8px 14px;cursor:pointer;text-align:left;border-radius:0;}
      .toggle-btn.on{border-color:var(--gold);color:var(--gold);background:#2a1e0a;}
      .ai-box{background:#1a1628;border:1px solid #3a2e50;padding:13px;margin-bottom:13px;}
      .ai-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7a6898;margin-bottom:7px;}
      .ai-result{font-size:15px;color:#d0c8e8;line-height:1.8;white-space:pre-wrap;}
      .ai-loading{display:flex;gap:5px;align-items:center;padding:10px 0;}
      .ai-dot{width:6px;height:6px;background:#8a70c0;border-radius:50%;animation:pulse 1.2s ease-in-out infinite;}
      .ai-dot:nth-child(2){animation-delay:.2s;}.ai-dot:nth-child(3){animation-delay:.4s;}
      @keyframes pulse{0%,80%,100%{opacity:.3;transform:scale(.8);}40%{opacity:1;transform:scale(1);}}
      .ai-ta{width:100%;background:#1a1628;border:1px solid #3a2e50;color:#d0c8e8;font-family:'DM Mono',monospace;font-size:16px;padding:10px 12px;outline:none;resize:none;border-radius:0;-webkit-appearance:none;margin-bottom:10px;display:block;}
      .ai-ta:focus{border-color:#6a50a0;}
      .diag-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:10px;}
      .diag-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#7a6898;margin-bottom:4px;display:block;}
      .diag-input{background:#1a1628;border:1px solid #3a2e50;color:#d0c8e8;font-family:'DM Mono',monospace;font-size:18px;padding:9px 11px;outline:none;-webkit-appearance:none;border-radius:0;width:100%;}
      .compass-wrap{background:var(--bg3);border:1px solid var(--border);padding:14px;margin-bottom:14px;}
      .compass-title{font-family:'Playfair Display',serif;font-size:17px;color:var(--gold);margin-bottom:2px;}
      .compass-sub{font-size:11px;color:var(--muted);margin-bottom:8px;}
      .compass-axis{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:2px;}
      .compass-legend{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 10px;margin-top:10px;}
      .compass-legend-item{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid transparent;color:var(--text3);font-family:'DM Mono',monospace;font-size:11px;padding:5px 6px;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:2px;}
      .compass-legend-item:active,.compass-legend-item.sel{background:var(--bg2);border-color:var(--border);color:var(--text);}
      .compass-legend-dot{width:18px;height:18px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#1a1410;}
      .compass-result{margin-top:10px;padding:10px;background:#1a1610;border:1px solid var(--border);}
      .compass-result-label{font-size:15px;font-weight:500;margin-bottom:3px;}
      .compass-result-desc{font-size:13px;color:var(--text3);margin-bottom:5px;}
      .compass-result-fix{font-size:14px;color:var(--text2);line-height:1.6;}
      .info-sec{margin-bottom:14px;}
      .info-lbl{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
      .info-txt{font-size:15px;color:var(--text2);line-height:1.75;}
      .fpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
      .fpill{font-size:11px;letter-spacing:1px;border:1px solid var(--gold);color:var(--gold);padding:3px 10px;}
      .timer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}
      .timer-modal{background:var(--bg2);border:1px solid var(--border);padding:28px 24px;width:100%;max-width:340px;text-align:center;}
      .timer-stage-name{font-family:'Playfair Display',serif;font-size:24px;color:var(--gold);margin-bottom:12px;}
      .timer-stages-row{display:flex;gap:6px;justify-content:center;margin-bottom:20px;flex-wrap:wrap;}
      .timer-pip{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border);color:var(--dim);}
      .timer-pip.active{border-color:var(--gold);color:var(--gold);}
      .timer-pip.done{border-color:var(--green);color:var(--green);}
      .timer-ring-wrap{position:relative;width:150px;height:150px;margin:0 auto 16px;}
      .timer-ring{width:150px;height:150px;}
      .timer-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--text);font-weight:500;font-family:'DM Mono',monospace;}
      .timer-action{font-size:14px;color:var(--text3);margin-bottom:18px;line-height:1.5;min-height:36px;padding:0 8px;}
      .timer-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
      .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;}
      .modal{background:var(--bg2);border:1px solid var(--border);padding:22px;width:100%;max-width:380px;max-height:90vh;overflow-y:auto;}
      .modal h2{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);margin-bottom:8px;}
      .modal p{font-size:13px;color:var(--text3);line-height:1.7;margin-bottom:10px;}
      .modal input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:16px;padding:10px 12px;outline:none;margin-bottom:12px;border-radius:0;-webkit-appearance:none;}
      .modal input:focus{border-color:var(--gold);}
      .empty{padding:40px 16px;text-align:center;color:var(--dim);font-size:14px;}
      .toast{position:fixed;bottom:18px;right:14px;background:var(--gold);color:var(--bg);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100;}
      .toast.show{opacity:1;}

      /* SCREEN NAV */
      .screen-nav{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0;}
      .screen-nav::-webkit-scrollbar{display:none;}
      .screen-tab{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap;flex-shrink:0;border:none;background:none;-webkit-tap-highlight-color:transparent;}
      .screen-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
      .screen-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;width:100%;}

      /* COMPARE */
      .compare-picker{display:flex;flex-wrap:wrap;gap:6px;}
      .compare-chip{font-family:'DM Mono',monospace;font-size:13px;padding:7px 12px;background:var(--bg3);border:1px solid var(--border);color:var(--text3);cursor:pointer;-webkit-tap-highlight-color:transparent;}
      .compare-chip.sel{border-color:var(--gold);color:var(--gold);background:#2a1e0a;}
      .compare-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
      .compare-col{background:var(--bg3);border:1px solid var(--border);padding:14px;min-width:0;}
      .compare-name{font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);}
      .compare-roaster{font-size:11px;color:var(--muted);margin-bottom:8px;}
      .compare-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border2);}
      .compare-row.diff{background:rgba(212,170,122,0.1);margin:0 -6px;padding:4px 6px;border-bottom-color:var(--gold);}
      .compare-row.diff span:last-child{color:var(--gold);font-weight:600;}
      .compare-row span:first-child{color:var(--muted);flex-shrink:0;}
      .compare-row span:last-child{text-align:right;overflow-wrap:anywhere;}
      .compare-notes{font-size:13px;color:var(--text3);margin-top:8px;line-height:1.6;}

      /* DISCOVERY */
      .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
      .stat-box{background:var(--bg3);border:1px solid var(--border);padding:12px 8px;text-align:center;}
      .stat-num{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);line-height:1.15;}
      .stat-lbl{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:4px;}
      .donut-wrap{display:flex;align-items:center;gap:16px;background:var(--bg3);border:1px solid var(--border);padding:14px;margin-bottom:16px;}
      .donut-svg{width:90px;height:90px;flex-shrink:0;}
      .donut-legend{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
      .donut-legend-row{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text2);background:transparent;border:none;padding:2px 0;width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:'DM Mono',monospace;}
      .donut-legend-row:active{opacity:0.7;}
      .donut-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
      .donut-legend-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .donut-legend-n{color:var(--muted);font-size:11px;}
      .rank-list{display:flex;flex-direction:column;gap:4px;}
      .rank-row{display:flex;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);padding:9px 12px;width:100%;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;font-family:'DM Mono',monospace;}
      .rank-row:active{border-color:var(--gold);}
      .rank-num{font-family:'Playfair Display',serif;font-size:14px;color:var(--dim);width:16px;flex-shrink:0;}
      .rank-lbl{flex:1;font-size:13px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
      .rank-n{font-size:10px;color:var(--muted);flex-shrink:0;}
      .rank-avg{font-size:12px;color:var(--gold);flex-shrink:0;width:28px;text-align:right;}

      /* KIOSK */
      .kiosk-view{position:fixed;inset:0;background:var(--bg);z-index:70;overflow-y:auto;padding:24px;}
      .kiosk-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
      .kiosk-hdr h1{font-family:'Playfair Display',serif;font-size:34px;color:var(--gold);}
      .kiosk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
      .kiosk-card{background:var(--bg2);border:1px solid var(--border);cursor:pointer;overflow:hidden;-webkit-tap-highlight-color:transparent;}
      .kiosk-card:active{border-color:var(--gold);}
      .kiosk-card.brewing{border-color:var(--blue);}
      .kiosk-card-img{width:100%;height:140px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:34px;overflow:hidden;}
      .kiosk-card-body{padding:14px;}
      .kiosk-card-name{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold);}

      .kiosk-card-meta{font-size:12px;color:var(--text3);margin-top:6px;}
      .kiosk-card-flavor{font-size:13px;color:var(--text2);margin-top:6px;font-style:italic;}

      .rf-n{font-size:10px;color:var(--muted);}
      .rf-note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5;}
      .rf-link{background:none;border:none;color:var(--gold);font-family:'DM Mono',monospace;font-size:11px;text-decoration:underline;cursor:pointer;padding:0;}
      .btn-link{background:none;border:none;color:var(--gold);font-family:'DM Mono',monospace;font-size:12px;text-decoration:underline;cursor:pointer;padding:8px 0;-webkit-tap-highlight-color:transparent;}
      /* COMPASS V2 */
      .cv2{margin:2px 0 4px;}

      .cv2-hint{font-size:12px;color:var(--text3);min-height:34px;line-height:1.5;margin-bottom:2px;}
      .tchips{display:flex;flex-wrap:wrap;gap:7px;}
      .tchip{font-family:'DM Mono',monospace;font-size:13px;padding:8px 13px;background:var(--bg3);border:1px solid var(--border);color:var(--text3);cursor:pointer;border-radius:20px;-webkit-tap-highlight-color:transparent;}
      .tchip.on{background:#2a1e0a;border-color:var(--gold);color:var(--gold);}
      .tchip.good.on{background:#16241a;border-color:var(--green);color:var(--green);}
      .diag-hint{font-size:11px;color:var(--muted);line-height:1.5;align-self:end;padding-bottom:6px;}
      .move-card{background:#1a1610;border:1px solid var(--border);border-left:3px solid var(--gold);padding:14px;margin:6px 0 14px;}
      .move-eyebrow{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
      .move-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:6px;}
      .move-body{font-size:15px;color:var(--text);line-height:1.55;margin-bottom:8px;}
      .move-grind{font-size:18px;color:var(--gold);letter-spacing:1px;margin-bottom:8px;}
      .move-why{font-size:12px;color:var(--text3);line-height:1.55;margin-bottom:8px;}
      .move-trend{font-size:12px;padding:7px 9px;margin-bottom:8px;line-height:1.5;border:1px solid var(--border);}
      .move-trend.good{color:var(--green);border-color:#3a5a28;background:#141e12;}
      .move-trend.bad{color:var(--red);border-color:#5a2a2a;background:#201212;}
      .move-flag{font-size:12px;color:var(--gold);line-height:1.5;margin-bottom:6px;padding-left:10px;border-left:2px solid var(--gold);}
      .dialed-card{background:#141e12;border:1px solid #3a5a28;padding:16px;margin-bottom:14px;}
      .dialed-badge{font-family:'Playfair Display',serif;font-size:22px;color:var(--green);}
      .dialed-sub{font-size:12px;color:var(--muted);margin:2px 0 12px;}
      .zdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;}
      /* STATS */
      .bars{display:flex;gap:8px;align-items:flex-end;height:104px;}
      .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;}
      .bar{width:100%;background:var(--gold);opacity:.85;}
      .bar-n{font-size:11px;color:var(--text2);min-height:14px;}
      .bar-l{font-size:10px;color:var(--muted);}

      .hbar-l{width:92px;font-size:12px;color:var(--text3);}

      /* ── VISUAL REFRESH (overrides the rules above) ── */
      :root{--bg:#14100c;--bg2:#1c1611;--bg3:#251d16;--border:#3a2e22;--border2:#2b2219;--r:14px;--rs:10px;--sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--mono:'DM Mono',ui-monospace,Menlo,monospace;--serif:'Playfair Display',Georgia,serif;}

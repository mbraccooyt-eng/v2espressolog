const {useState,useEffect,useRef} = React;

const DOTS=5,GRIND_MAX=12;
const METHODS=["espresso","aeropress","pourover"];

// ── STORAGE ────────────────────────────────────────────────────────────────
function migrate(b){
  return{roastDate:"",imageUrl:"",imageBase64:"",imageOffsetX:50,imageOffsetY:50,imageZoom:100,rating:0,altitude:"",varietal:"",flavorProfile:"",inStock:true,currentlyBrewing:false,savedRecipes:{aeropress:[],pourover:[]},...b,
    methods:{espresso:{...DEF.espresso,...(b.methods?.espresso||{})},aeropress:{...DEF.aeropress,...(b.methods?.aeropress||{})},pourover:{...DEF.pourover,...(b.methods?.pourover||{})}},
    grindLogs:{espresso:b.grindLogs?.espresso||[],aeropress:b.grindLogs?.aeropress||[],pourover:b.grindLogs?.pourover||[]},
    savedRecipes:b.savedRecipes||{aeropress:[],pourover:[]}};
}
function loadBeans(){
  try{
    const r=localStorage.getItem(STORAGE_KEY);
    if(r)return JSON.parse(r).map(migrate);
    for(const k of LEGACY_KEYS){const v=localStorage.getItem(k);if(v){const b=JSON.parse(v).map(migrate);localStorage.setItem(STORAGE_KEY,JSON.stringify(b));return b;}}
  }catch(e){}
  return[];
}
function saveBeans(b){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(b));}catch(e){}}

function loadAwayLog(){try{const r=localStorage.getItem(AWAYLOG_KEY);return r?JSON.parse(r):[];}catch(e){return[];}}
function saveAwayLog(a){try{localStorage.setItem(AWAYLOG_KEY,JSON.stringify(a));}catch(e){}}

// ── HELPERS ────────────────────────────────────────────────────────────────
function grindLabel(pos){if(!pos)return"—";if(pos.dot===0)return String(pos.whole);return pos.whole+"·".repeat(pos.dot);}
function daysAgo(s){if(!s)return null;const d=new Date(s);if(isNaN(d))return null;const n=Math.floor((Date.now()-d.getTime())/86400000);return n===0?"Today":n===1?"1 day ago":n+" days ago";}
function daysAgoNum(s){if(!s)return null;const d=new Date(s);if(isNaN(d))return null;return Math.floor((Date.now()-d.getTime())/86400000);}
function fmtDate(s){if(!s)return"";const d=new Date(s+(s.length<=10?"T00:00:00":""));if(isNaN(d))return s;const mm=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0"),yy=String(d.getFullYear()).slice(-2);return`${mm}/${dd}/${yy}`;}
function freshness(s){const n=daysAgoNum(s);if(n===null)return null;if(n<5)return{label:"Too Fresh",color:"var(--blue)"};if(n<=30)return{label:"Peak",color:"var(--green)"};if(n<=45)return{label:"Aging",color:"var(--gold)"};return{label:"Past Peak",color:"var(--red)"};}
function cleanMd(t){if(!t)return"";return t.replace(/^#{1,6}\s+/gm,"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/\*(.+?)\*/g,"$1").replace(/^-{3,}\s*$/gm,"").replace(/^[-*]\s+/gm,"• ").trim();}

// ── AI ─────────────────────────────────────────────────────────────────────
async function callClaude(system,user,json){
  const key=window._COFFEE_API_KEY;
  if(!key)return json?null:"⚠️ No API key. Tap ⚙ to add your Anthropic API key.";
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1200,system,messages:[{role:"user",content:user}]})});
    if(!res.ok){const t=await res.text();return json?null:"API error "+res.status+": "+t.slice(0,200);}
    const d=await res.json();
    if(d.error)return json?null:"API error: "+d.error.message;
    const text=d.content?.map(b=>b.text||"").join("")||"";
    if(json){try{return JSON.parse(text.replace(/```json|```/g,"").trim());}catch{return null;}}
    return text;
  }catch(e){
    const m=e.message||String(e);
    if(m.includes("NetworkError")||m.includes("Failed to fetch")||m.includes("Load failed"))
      return json?null:"⚠️ Network blocked. Try opening in Safari browser directly.";
    return json?null:"Error: "+m;
  }
}

// Vision variant: pass a base64 data URL image (with or without the data: prefix) plus a text prompt.
async function callClaudeVision(system,userText,imageDataUrl,json){
  const key=window._COFFEE_API_KEY;
  if(!key)return json?null:"⚠️ No API key. Tap ⚙ to add your Anthropic API key.";
  try{
    const match=imageDataUrl.match(/^data:(image\/[a-zA-Z]+);base64,(.+)$/);
    if(!match)return json?null:"Invalid image data.";
    const mediaType=match[1],base64Data=match[2];
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1200,system,messages:[{role:"user",content:[
        {type:"image",source:{type:"base64",media_type:mediaType,data:base64Data}},
        {type:"text",text:userText}
      ]}]})});
    if(!res.ok){const t=await res.text();return json?null:"API error "+res.status+": "+t.slice(0,200);}
    const d=await res.json();
    if(d.error)return json?null:"API error: "+d.error.message;
    const text=d.content?.map(b=>b.text||"").join("")||"";
    if(json){try{return JSON.parse(text.replace(/```json|```/g,"").trim());}catch{return null;}}
    return text;
  }catch(e){
    const m=e.message||String(e);
    if(m.includes("NetworkError")||m.includes("Failed to fetch")||m.includes("Load failed"))
      return json?null:"⚠️ Network blocked. Try opening in Safari browser directly.";
    return json?null:"Error: "+m;
  }
}

const SYSTEM=`You are an expert specialty coffee consultant. Equipment: La Marzocco Linea Micra (dual boiler), Mahlkonig X64 SD single dose grinder (0-1 range for espresso, full 0-12 for manual methods, 5 dots between each number on the dial), Hario V60 with METAL mesh filter (no paper), AeroPress with PAPER filter (not metal), standard AeroPress (max 220g water capacity), temperature-controlled kettle, RO water with Third Wave espresso minerals.
CRITICAL RULES: Shot SLOW >35s = NEVER finer grind. Shot FAST <22s = NEVER coarser. Sour+slow = channeling, fix puck prep first. Bitter+fast = over-extraction, coarser grind. AeroPress uses paper filter — grind accordingly. V60 uses metal filter — grind coarser than paper equivalent. AeroPress max 220g water. 3-5 bullets max. No fluff.`;

// ── SMALL COMPONENTS (defined outside App so they never remount) ───────────
function Field({label,value,onChange,multiline,placeholder}){
  return multiline
    ?<div className="field"><label>{label}</label><textarea value={value} onChange={e=>onChange(e.target.value)} rows={2} placeholder={placeholder||""}/></div>
    :<div className="field"><label>{label}</label><input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder||""}/></div>;
}
function Toggle({label,value,onChange}){
  return<div className="field"><label>{label}</label><button className={"toggle-btn"+(value?" on":"")} onClick={()=>onChange(!value)}>{value?"Yes":"No"}</button></div>;
}
function Sel({label,value,onChange,options}){
  return<div className="field"><label>{label}</label><select value={value} onChange={e=>onChange(e.target.value)} className="sel-input">{options.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}</select></div>;
}

// Drag-to-pan, pinch/wheel-to-zoom crop frame. Position is stored as % offsets (0-100) of the
// image's own top-left within the frame, zoom as a scale multiplier — both saved on the bean.
function ImageCropBox({src,posX,posY,zoom,onChange}){
  const frameRef=useRef(null);
  const dragRef=useRef(null);
  const px=posX??50,py=posY??50,z=zoom??100;

  const clampAndSet=(nx,ny,nz)=>{
    const cx=Math.max(0,Math.min(100,nx));
    const cy=Math.max(0,Math.min(100,ny));
    const cz=Math.max(100,Math.min(300,nz));
    onChange({posX:cx,posY:cy,zoom:cz});
  };

  const startDrag=(clientX,clientY)=>{dragRef.current={startX:clientX,startY:clientY,origX:px,origY:py};};
  const moveDrag=(clientX,clientY)=>{
    if(!dragRef.current||!frameRef.current)return;
    const rect=frameRef.current.getBoundingClientRect();
    const dxPct=((clientX-dragRef.current.startX)/rect.width)*100;
    const dyPct=((clientY-dragRef.current.startY)/rect.height)*100;
    // Dragging the image right should reveal more of the left side, so invert.
    clampAndSet(dragRef.current.origX-dxPct,dragRef.current.origY-dyPct,z);
  };
  const endDrag=()=>{dragRef.current=null;};

  return<div className="crop-box-wrap">
    <div ref={frameRef} className="crop-box-frame"
      onMouseDown={e=>{e.preventDefault();startDrag(e.clientX,e.clientY);}}
      onMouseMove={e=>moveDrag(e.clientX,e.clientY)}
      onMouseUp={endDrag} onMouseLeave={endDrag}
      onTouchStart={e=>{const t=e.touches[0];startDrag(t.clientX,t.clientY);}}
      onTouchMove={e=>{const t=e.touches[0];moveDrag(t.clientX,t.clientY);}}
      onTouchEnd={endDrag}
      onWheel={e=>{e.preventDefault();clampAndSet(px,py,z+(e.deltaY<0?8:-8));}}
    >
      <img src={src} alt="Crop preview" draggable={false} style={{objectPosition:`${px}% ${py}%`,transform:`scale(${z/100})`}} onError={ev=>ev.target.style.opacity=0.15}/>
      <div className="crop-box-hint">Drag to reposition</div>
    </div>
    <div className="crop-box-zoom-row">
      <span className="crop-box-zoom-lbl">Zoom</span>
      <input type="range" min="100" max="300" value={z} onChange={e=>clampAndSet(px,py,parseInt(e.target.value))} className="img-adjust-slider"/>
      <button className="btn sm" onClick={()=>clampAndSet(50,50,100)}>Reset</button>
    </div>
  </div>;
}

function GrindSelector({value,onChange}){
  const cur=value||{whole:0,dot:0};
  const groups=[];
  for(let w=0;w<=GRIND_MAX;w++){const g=[];for(let d=0;d<=(w===GRIND_MAX?0:DOTS);d++)g.push({whole:w,dot:d});groups.push(g);}
  const sel=p=>cur.whole===p.whole&&cur.dot===p.dot;
  return<div className="grind-groups">{groups.map((g,wi)=><div key={wi} className="grind-group">{g.map((p,i)=><button key={i} className={"grind-pos"+(sel(p)?" active":"")+(p.dot===0?" whole":"")} onClick={()=>onChange(p)}>{grindLabel(p)}</button>)}</div>)}</div>;
}

function StarRating({value,onChange}){
  return<div className="rating-wrap">
    <div className="rating-stars">{[1,2,3,4,5].map(s=>{const w=Math.max(0,Math.min(1,(value||0)/2-(s-1)));return<div key={s} className="star-c"><span className="star-bg">★</span><span className="star-fg" style={{width:(w*100)+"%"}}>★</span></div>;})}
    </div>
    <div className="rating-val">{value?(+value).toFixed(2).replace(/\.?0+$/,"")+" / 10":"Not rated"}</div>
    <input type="range" min="0" max="10" step="0.25" value={value||0} onChange={e=>onChange(parseFloat(e.target.value))} className="rating-slider"/>
  </div>;
}

function ShotParam({label,value,unit,onSave,wide,small,options}){
  const[open,setOpen]=useState(false);
  const[custom,setCustom]=useState(false);
  const[draft,setDraft]=useState(value);
  const ref=useRef(null);
  useEffect(()=>{setDraft(value);},[value]);
  const commit=v=>{onSave(v!==undefined?v:draft);setOpen(false);setCustom(false);};
  return<div className={"pm"+(wide?" w":"")} style={{cursor:"pointer",position:"relative"}} onClick={()=>!open&&setOpen(true)}>
    <div className="pm-lbl">{label}</div>
    <div className={"pm-val"+(small?" sm":"")} style={{color:open?"var(--gold)":undefined}}>{value||"—"}{unit&&!open&&<span className="pm-unit">{unit}</span>}</div>
    {open&&<div className="param-dd" onClick={e=>e.stopPropagation()}>
      {options&&!custom&&<div className="param-opts">
        {options.map(o=><button key={o.value||o} className={"param-opt"+((o.value||o)===value?" sel":"")} onClick={()=>commit(o.value||o)}>{o.label||o}</button>)}
        <button className="param-opt custom-opt" onClick={()=>{setCustom(true);setTimeout(()=>ref.current&&ref.current.focus(),50);}}>Custom...</button>
      </div>}
      {(!options||custom)&&<div className="param-custom">
        <input ref={ref} className="param-custom-input" value={draft} onChange={e=>setDraft(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setOpen(false);setCustom(false);}}}
          placeholder={unit?"Enter "+unit:"Enter value"}/>
        <button className="btn p sm" onClick={()=>commit()} style={{marginTop:6}}>Set</button>
      </div>}
      <button className="param-close" onClick={()=>{setOpen(false);setCustom(false);}}>✕</button>
    </div>}
  </div>;
}

function TimerModal({stages,onClose}){
  const[idx,setIdx]=useState(0);
  const[elapsed,setElapsed]=useState(0);
  const[running,setRunning]=useState(false);
  const[done,setDone]=useState(false);
  const ref=useRef(null);
  const stage=stages[idx];
  const total=stage?parseInt(stage.duration)||0:0;
  const remaining=Math.max(0,total-elapsed);
  useEffect(()=>{
    if(running&&!done){
      ref.current=setInterval(()=>{
        setElapsed(e=>{const n=e+1;if(n>=total){clearInterval(ref.current);if(idx<stages.length-1)setTimeout(()=>{setIdx(i=>i+1);setElapsed(0);setRunning(true);},600);else{setDone(true);setRunning(false);}return total;}return n;});
      },1000);
    }
    return()=>clearInterval(ref.current);
  },[running,idx,total,done]);
  const reset=()=>{clearInterval(ref.current);setIdx(0);setElapsed(0);setRunning(false);setDone(false);};
  const pct=total>0?(elapsed/total)*100:0;
  const mins=Math.floor(remaining/60),secs=remaining%60;
  return<div className="timer-overlay" onClick={onClose}>
    <div className="timer-modal" onClick={e=>e.stopPropagation()}>
      <div className="timer-stage-name">{done?"Done! ✓":stage?stage.name:""}</div>
      <div className="timer-stages-row">{stages.map((s,i)=><div key={i} className={"timer-pip"+(i===idx?" active":i<idx?" done":"")}>{s.name}</div>)}</div>
      <div className="timer-ring-wrap">
        <svg viewBox="0 0 120 120" className="timer-ring">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" strokeWidth="8"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke={done?"var(--green)":"var(--gold)"} strokeWidth="8"
            strokeDasharray={`${2*Math.PI*52}`} strokeDashoffset={`${2*Math.PI*52*(1-pct/100)}`}
            strokeLinecap="round" style={{transform:"rotate(-90deg)",transformOrigin:"center",transition:"stroke-dashoffset 0.8s ease"}}/>
        </svg>
        <div className="timer-time">{done?"✓":`${mins}:${String(secs).padStart(2,"0")}`}</div>
      </div>
      {stage&&stage.action&&<div className="timer-action">{stage.action}</div>}
      <div className="timer-btns">
        {!running&&!done&&<button className="btn p" onClick={()=>setRunning(true)}>{elapsed>0?"Resume":"Start"}</button>}
        {running&&<button className="btn" onClick={()=>{clearInterval(ref.current);setRunning(false);}}>Pause</button>}
        <button className="btn" onClick={reset}>Reset</button>
        <button className="btn sm" onClick={onClose}>Close</button>
      </div>
    </div>
  </div>;
}

    <div style={{position:"relative",margin:"4px 0"}}>

        <line x1="33" y1="8" x2="13" y2="92" stroke="#3a2e22" strokeWidth="0.4" clipPath="url(#cc)"/>
        <line x1="63" y1="8" x2="43" y2="92" stroke="#3a2e22" strokeWidth="0.4" clipPath="url(#cc)"/>
        <line x1="25" y1="36" x2="95" y2="36" stroke="#3a2e22" strokeWidth="0.4" clipPath="url(#cc)"/>
        <line x1="15" y1="64" x2="85" y2="64" stroke="#3a2e22" strokeWidth="0.4" clipPath="url(#cc)"/>
        {zones.map(z=><g key={z.id} onClick={()=>onSelect(selected?.id===z.id?null:z)} style={{cursor:"pointer"}}>
          <circle cx={z.x} cy={z.y} r={selected?.id===z.id?6:4.6} fill={z.color}

            style={{transition:"all 0.15s"}}/>
          <text x={z.x} y={z.y} textAnchor="middle" dominantBaseline="central" fontSize={selected?.id===z.id?5:4} fontWeight="700" fill="#1a1410" style={{pointerEvents:"none"}}>
            {z.n}
          </text>
        </g>)}
      </svg>
    </div>
    <div className="compass-axis"><span>Strong</span><span/><span>Weak</span></div>
    <div className="compass-legend">
      {zones.map(z=><button key={z.id} className={"compass-legend-item"+(selected?.id===z.id?" sel":"")} onClick={()=>onSelect(selected?.id===z.id?null:z)}>
        <span className="compass-legend-dot" style={{background:z.color}}>{z.n}</span>{z.label}
      </button>)}
    </div>
    {selected&&<div className="compass-result">
      <div className="compass-result-label" style={{color:selected.color}}>{selected.label}</div>
      <div className="compass-result-desc">{selected.desc}</div>
      <div className="compass-result-fix"><span style={{color:"var(--gold)"}}>Action: </span>{selected.fix}</div>
    </div>}
  </div>;
}

  const startAdd=()=>{setDraft({roaster:"",name:"",origin:"",process:"",roast:"",altitude:"",varietal:"",flavorProfile:"",roastDate:"",imageUrl:"",imageBase64:"",rating:0,inStock:true,currentlyBrewing:false,methods:{espresso:{...DEF.espresso},aeropress:{...DEF.aeropress},pourover:{...DEF.pourover}}});setAdding(true);setEditing(false);setShowList(false);setUrlImport(null);setUrlInput("");setPhotoImport(null);setCapturedPhoto(null);};
  const saveNew=()=>{if(!draft.name)return;const id=Date.now();upd(bs=>[...bs,{...draft,id,grindLogs:{espresso:[],aeropress:[],pourover:[]},savedRecipes:{aeropress:[],pourover:[]}}]);setSelId(id);setAdding(false);setShowList(false);setTab("shot");};
  const delBean=id=>{upd(bs=>bs.filter(b=>b.id!==id));setSelId(null);setShowList(true);};
  const startEdit=()=>{setDraft({...cur,methods:JSON.parse(JSON.stringify(cur.methods))});setEditing(true);};
  const saveEdit=()=>{upd(bs=>bs.map(b=>b.id===selId?{...b,...draft}:b));setEditing(false);};
  const updDraftM=(f,v)=>setDraft(d=>({...d,methods:{...d.methods,[method]:{...d.methods[method],[f]:v}}}));
  const updM=(f,v)=>{let val=v;if(f==="water"&&method==="aeropress"){const n=parseInt(val);if(!isNaN(n)&&n>220)val="220";}upd(bs=>bs.map(b=>b.id===selId?{...b,methods:{...b.methods,[method]:{...b.methods[method],[f]:val}}}:b));};
  const updB=(f,v)=>upd(bs=>bs.map(b=>b.id===selId?{...b,[f]:v}:b));

  const saveGrind=()=>{const e={...grindDraft,id:Date.now(),date:grindDraft.date||new Date().toLocaleDateString()};upd(bs=>bs.map(b=>b.id===selId?{...b,grindLogs:{...b.grindLogs,[method]:[...(b.grindLogs[method]||[]),e]}}:b));setAddingGrind(false);setGrindDraft({position:{whole:0,dot:0},note:"",date:""});};
  const delGrind=gid=>upd(bs=>bs.map(b=>b.id===selId?{...b,grindLogs:{...b.grindLogs,[method]:b.grindLogs[method].filter(g=>g.id!==gid)}}:b));

  const saveRecipe=text=>{const r={id:Date.now(),date:new Date().toLocaleDateString(),text};upd(bs=>bs.map(b=>b.id===selId?{...b,savedRecipes:{...b.savedRecipes,[method]:[...(b.savedRecipes?.[method]||[]),r]}}:b));};
  const delRecipe=(m,id)=>upd(bs=>bs.map(b=>b.id===selId?{...b,savedRecipes:{...b.savedRecipes,[m]:b.savedRecipes[m].filter(r=>r.id!==id)}}:b));

  const applyRecipe=text=>{
    const g=pats=>{for(const p of pats){const m=text.match(p);if(m)return m[1];}return null;};
    if(method==="aeropress"){
      const dose=g([/dose[:\s]+(\d+(?:\.\d+)?)\s*g/i]);
      const water=g([/water[:\s]+(\d+)\s*g/i,/(\d+)\s*g\s*water/i]);
      const temp=g([/(\d+(?:\.\d+)?)\s*°?F/i]);
      const steep=g([/steep[:\s]+(\d+)\s*s/i]);
      const press=g([/press[:\s]+(\d+)\s*s/i]);
      const bloom=g([/bloom.*?(\d+)\s*s/i]);
      if(dose)updM("dose",dose);if(water)updM("water",Math.min(220,parseInt(water)).toString());
      if(temp)updM("temp",temp);if(steep)updM("steepTime",steep);if(press)updM("pressTime",press);
      if(bloom){updM("bloom",true);updM("bloomTime",bloom);}
    }else if(method==="pourover"){
      const dose=g([/dose[:\s]+(\d+(?:\.\d+)?)\s*g/i]);
      const water=g([/water[:\s]+(\d+)\s*g/i]);
      const temp=g([/(\d+(?:\.\d+)?)\s*°?F/i]);
      const bloom=g([/bloom[:\s]+(\d+)\s*g/i]);
      const bloomT=g([/bloom.*?(\d+)\s*s/i]);
      const total=text.match(/total[:\s]+(\d+:\d+)/i)?.[1];
      if(dose)updM("dose",dose);if(water)updM("water",water);if(temp)updM("temp",temp);
      if(bloom)updM("bloomAmount",bloom);if(bloomT)updM("bloomTime",bloomT);if(total)updM("totalTime",total);
      updM("pours",text);
    }
  };

  const importFromText=()=>{
    const raw=importText.trim();
    // First try the new structured JSON export — exact round trip, all fields including images.
    try{
      const parsed=JSON.parse(raw);
      if(parsed&&parsed.type==="coffeeLogExport"&&Array.isArray(parsed.beans)){
        const incoming=parsed.beans.map(b=>migrate({...b,id:Date.now()+Math.random()}));
        if(incoming.length===0){setImportStatus("No beans found in file.");return;}
        upd(bs=>[...bs,...incoming.filter(nb=>!bs.some(b=>b.name===nb.name&&b.roaster===nb.roaster))]);
        setImportStatus(incoming.length+" bean(s) imported with full details!");
        setTimeout(()=>{setShowImportModal(false);setImportText("");setImportStatus("");},1500);
        return;
      }
    }catch(e){/* not JSON — fall through to legacy text parser below */}

    // Legacy plain-text export format (from before full JSON export existed).
    try{
      const lines=raw.split("\n");
      const newBeans=[];let cur=null;
      for(const line of lines){
        const t=line.trim();
        if(!t||t==="────")continue;
        if(t.includes(" — ")&&!t.startsWith(" ")&&!t.startsWith("Esp")&&!t.startsWith("Aero")&&!t.startsWith("Pour")){
          if(cur)newBeans.push(cur);
          const nm=t.match(/^(.+?) — (.+?)(?:\s*\[.*\])*$/);
          if(nm){cur=migrate({id:Date.now()+newBeans.length,roaster:nm[1].trim(),name:nm[2].replace(/\s*\[.*?\]/g,"").trim(),origin:"",process:"",roast:"",methods:{espresso:{...DEF.espresso},aeropress:{...DEF.aeropress},pourover:{...DEF.pourover}},grindLogs:{espresso:[],aeropress:[],pourover:[]},savedRecipes:{aeropress:[],pourover:[]}});
          if(t.includes("[OUT]"))cur.inStock=false;
          const rm=t.match(/\[([\d.]+)\/10\]/);if(rm)cur.rating=parseFloat(rm[1]);}
        }else if(cur&&t.includes("|")){const ps=t.split("|").map(s=>s.trim());if(ps.length>=2){cur.origin=ps[0];cur.process=ps[1];if(ps[2])cur.roast=ps[2];}}
        else if(cur&&t.startsWith("Espresso:")){const m=t.match(/Espresso:\s*([\d.]+)g\s*->\s*([\d.]+)g\s*\/\s*([\d.]+)s\s*\/\s*([\d.]+(?:\.[\d]+)?)F/);if(m){cur.methods.espresso.dose=m[1];cur.methods.espresso.yield=m[2];cur.methods.espresso.time=m[3];cur.methods.espresso.temp=m[4];}}
        else if(cur&&t.startsWith("AeroPress:")){const m=t.match(/AeroPress:\s*([\d.]+)g\s*\/\s*([\d.]+)g\s*\/\s*([\d.]+)F\s*\/\s*Steep\s*([\d.]+)s/);if(m){cur.methods.aeropress.dose=m[1];cur.methods.aeropress.water=m[2];cur.methods.aeropress.temp=m[3];cur.methods.aeropress.steepTime=m[4];}}
        else if(cur&&t.startsWith("Roast Date:")){cur.roastDate=t.replace("Roast Date:","").trim();}
        else if(cur&&t.startsWith("Altitude:")){cur.altitude=t.replace("Altitude:","").trim();}
        else if(cur&&t.startsWith("Varietal:")){cur.varietal=t.replace("Varietal:","").trim();}
        else if(cur&&t.startsWith("Flavor Profile:")){cur.flavorProfile=t.replace("Flavor Profile:","").trim();}
        else if(cur&&t.startsWith("  Tasting:")&&!cur._lastMethod){cur.methods.espresso.notes=t.replace("  Tasting:","").trim();}
        else if(cur&&t.startsWith("  Worked:")&&!cur._lastMethod){cur.methods.espresso.whatWorked=t.replace("  Worked:","").trim();}
      }
      if(cur)newBeans.push(cur);
      if(newBeans.length===0){setImportStatus("No beans found. Check format.");return;}
      upd(bs=>[...bs,...newBeans.filter(nb=>!bs.some(b=>b.name===nb.name&&b.roaster===nb.roaster))]);
      setImportStatus(newBeans.length+" bean(s) imported!");
      setTimeout(()=>{setShowImportModal(false);setImportText("");setImportStatus("");},1500);
    }catch(e){setImportStatus("Error: "+e.message);}
  };

  const importUrl=async()=>{if(!urlInput.trim())return;setUrlLoading(true);setUrlImport(null);const r=await callClaude("Extract coffee bean info from URL. Return ONLY valid JSON, no markdown.",`URL:${urlInput}\nReturn JSON:{"roaster":"","name":"","origin":"","process":"","roast":"","altitude":"","varietal":"","flavorProfile":"","imageUrl":""}`,true);if(r)setDraft(d=>({...d,...r}));setUrlImport(r||{error:"Couldn't parse URL."});setUrlLoading(false);};

  const handleBagPhoto=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const dataUrl=ev.target.result;
      setCapturedPhoto(dataUrl);
      // Use the scanned bag photo as the bean's image right away — no separate upload step needed.
      setDraft(d=>({...d,imageBase64:dataUrl,imageUrl:""}));
      setPhotoLoading(true);setPhotoImport(null);
      const r=await callClaudeVision(
        "You read coffee bag labels and extract structured info. Return ONLY valid JSON, no markdown, no explanation.",
        `Read this coffee bag label/photo and extract as much as you can identify. Leave a field as empty string "" if not visible or not stated on the bag. Return JSON exactly in this shape:\n{"roaster":"","name":"","origin":"","process":"","roast":"","altitude":"","varietal":"","flavorProfile":"","roastDate":""}\nFor roast, use one of: Light, Light-Medium, Medium, Medium-Dark, Dark — infer from any roast description if not explicit. For roastDate, use YYYY-MM-DD format if a date is visible, else leave empty.`,
        dataUrl,true
      );
      if(r){setDraft(d=>({...d,...r,imageBase64:dataUrl,imageUrl:""}));setPhotoImport(r);}
      else setPhotoImport({error:"Couldn't read the label clearly. Try a closer, well-lit photo, or fill in manually."});
      setPhotoLoading(false);
    };
    reader.readAsDataURL(file);
  };

  const handleAwayPhoto=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=async(ev)=>{
      const dataUrl=ev.target.result;
      setAwayCapturedPhoto(dataUrl);
      setAwayPhotoLoading(true);setAwayPhotoImport(null);
      const r=await callClaudeVision(
        "You read coffee bag labels and menu boards and extract structured info. Return ONLY valid JSON, no markdown, no explanation.",
        `Read this coffee bag label or cafe menu/board photo and extract what you can identify. Leave a field as empty string "" if not visible or not stated. Return JSON exactly in this shape:\n{"name":"","roaster":"","origin":"","process":"","roast":"","flavorProfile":""}\nFor roast, use one of: Light, Light-Medium, Medium, Medium-Dark, Dark — infer from description if not explicit.`,
        dataUrl,true
      );
      if(r){setAwayDraft(d=>({...d,...r}));setAwayPhotoImport(r);}
      else setAwayPhotoImport({error:"Couldn't read the label clearly. Try a closer, well-lit photo, or fill in manually."});
      setAwayPhotoLoading(false);
    };
    reader.readAsDataURL(file);
  };

  const runDiagnosis=async(followup)=>{
    if(!followup&&!diagInput.trim()&&!compass)return;
    setAiLoading(true);if(!followup)setAiResult("");
    const tStr=shotTime?shotTime+"s":(md.time?md.time+"s (logged)":"unknown");
    const yStr=shotYield?shotYield+"g":(md.yield?md.yield+"g (logged)":"unknown");
    const slow=shotTime&&parseInt(shotTime)>35?" SHOT WAS SLOW — do NOT recommend finer grind.":"";
    const fast=shotTime&&parseInt(shotTime)<22?" SHOT WAS FAST — do NOT recommend coarser grind.":"";
    const cCtx=compass?` Compass: ${compass.label} — ${compass.desc}.`:"";
    const ctx=method==="espresso"
      ?`Bean:${cur.name}(${cur.roaster}),${cur.origin},${cur.process},${cur.roast}. Setup:${md.dose}g/${md.temp}°F/grind ${grindLabel(lg?.position)}/pre-brew ${md.preBrew}. THIS SHOT:time=${tStr},yield=${yStr}.${slow}${fast}${cCtx}`
      :method==="aeropress"
      ?`Bean:${cur.name},${cur.process},${cur.roast}. AeroPress:${md.dose}g/${md.water}g/${md.temp}°F/steep ${md.steepTime}s/press ${md.pressTime}s.Inverted:${md.inverted}.Bloom:${md.bloom} ${md.bloomTime}s.Grind:${grindLabel(lg?.position)}.`
      :`Bean:${cur.name},${cur.process},${cur.roast}. Pour Over V60:${md.dose}g/${md.water}g/${md.temp}°F/bloom ${md.bloomAmount}g ${md.bloomTime}s/total ${md.totalTime}.Grind:${grindLabel(lg?.position)}.`;
    if(followup){
      const r=await callClaude(SYSTEM,`Previous setup and diagnosis:\n${lastDiagCtx}\nPrevious advice:\n${aiResult}\n\nThe person made this adjustment and pulled again: ${followup}\nCurrent setup:${ctx}\n\nDid the adjustment help? What should they try next?`);
      setAiResult(r);setAiLoading(false);setDiagFollowup("");
      return;
    }
    const msg=diagInput.trim()?`Setup:${ctx}\nTasting:${diagInput}\nAdjustments?`:`Setup:${ctx}\nCompass:${compass?.label}.Adjustments?`;
    setLastDiagCtx(ctx);
    const r=await callClaude(SYSTEM,msg);setAiResult(r);setAiLoading(false);
  };

  const genRecipe=async feedback=>{
    setAiLoading(true);setAiResult("");
    const bInfo=`${cur.name} by ${cur.roaster}. Origin:${cur.origin}. Process:${cur.process}. Roast:${cur.roast}.`;
    const saved=cur.savedRecipes?.[method];
    const prev=activeRecipeIdx!==null&&saved?saved[activeRecipeIdx]?.text:null;
    const inst=method==="aeropress"
      ?"Generate AeroPress recipe. Uses PAPER filter. Max 220g water. Include:dose(g),water(g≤220),temp(°F),inverted or standard,bloom time(s),steep time(s),press time(s),grind setting on 0-12 scale with dots (e.g. 5··). Brief rationale."
      :"Generate pour over for Hario V60 with METAL filter (grind coarser than paper). Include:dose(g),water(g),temp(°F),bloom amount(g) and time(s),pour sequence with timing,total time,grind on 0-12 scale. Brief rationale.";
    const r=await callClaude(SYSTEM,`Bean:${bInfo}${recipeCtx?`\nContext:${recipeCtx}`:""}${prev?`\nPrevious recipe:\n${prev}`:""}${feedback?`\nFeedback:${feedback}\nAdjust accordingly.`:""}\n\n${inst}`);
    setAiResult(r);setAiLoading(false);
  };

  const launchTimer=m=>{
    const stages=[];
    if(m==="aeropress"){
      if(md.bloom&&md.bloomTime)stages.push({name:"Bloom",duration:md.bloomTime,action:`Pour ${Math.round(parseInt(md.dose||15)*2)}g water, stir`});
      if(md.steepTime)stages.push({name:"Steep",duration:md.steepTime,action:"Wait — let it brew"});
      if(md.pressTime)stages.push({name:"Press",duration:md.pressTime,action:"Press slowly and steadily"});
    }else{
      if(md.bloomAmount&&md.bloomTime)stages.push({name:"Bloom",duration:md.bloomTime,action:`Pour ${md.bloomAmount}g, saturate all grounds`});
      if(md.pours){const ls=md.pours.split("\n").filter(l=>l.trim()&&!l.includes("dose")&&!l.includes("water")&&!l.includes("temp")&&!l.includes("grind"));ls.forEach((l,i)=>{const m=l.match(/(\d+)\s*s/i);if(m)stages.push({name:`Pour ${i+1}`,duration:m[1],action:l.replace(/^\d+:\d+\s*—?\s*/,"").trim()});});}
      if(stages.length<=1){const pp=Math.round((parseInt(md.water||300)-parseInt(md.bloomAmount||40))/3);[1,2,3].forEach(i=>stages.push({name:`Pour ${i}`,duration:"35",action:`Pour ${pp}g in slow spirals`}));}
    }
    if(stages.length){setTimerStages(stages);setShowTimer(true);}
  };

  const exportText=(compact)=>{
    // Full export: every field verbatim, images included — best for backup or moving to another device.
    // Compact export: strips embedded photo data (imageBase64), which is what actually bloats the text
    // and breaks pasting into Messages/etc. imageUrl (a link) is kept either way since it's tiny.
    const trimmedBeans=compact?beans.map(({imageBase64,...rest})=>rest):beans;
    const payload={type:"coffeeLogExport",version:1,exportedAt:new Date().toISOString(),beans:trimmedBeans};
    const t=JSON.stringify(payload,compact?null:null,compact?0:2);

    return t;

  const saveApiKey=()=>{window._COFFEE_API_KEY=apiKeyInput.trim();try{localStorage.setItem("coffeeLog_apikey",apiKeyInput.trim());}catch(e){}setShowApiModal(false);};

  // ── TASTING LOG (away) ──
  const addAway=()=>{if(!awayDraft.name.trim())return;setAwayLog(a=>[{...awayDraft,id:Date.now(),date:awayDraft.date||new Date().toLocaleDateString()},...a]);setAwayDraft({name:"",roaster:"",place:"",method:"",origin:"",process:"",roast:"",flavorProfile:"",notes:"",rating:0,date:""});setAddingAway(false);setAwayPhotoImport(null);setAwayCapturedPhoto(null);};
  const delAway=id=>setAwayLog(a=>a.filter(x=>x.id!==id));

  // ── DISCOVERY ──
  const runDiscovery=async()=>{
    setDiscoveryLoading(true);setDiscoveryResult("");
    const rated=beans.filter(b=>b.rating>0).map(b=>`${b.name} (${b.roaster}) - ${b.origin||"?"}, ${b.process||"?"}, ${b.roast||"?"} - rated ${b.rating}/10${b.flavorProfile?" - "+b.flavorProfile:""}`).join("\n");
    const away=awayLog.map(a=>`${a.name}${a.roaster?" ("+a.roaster+")":""} - ${a.origin||"?"}, ${a.process||"?"} - rated ${a.rating||"?"}/10${a.notes?" - "+a.notes:""}`).join("\n");
    if(!rated&&!away){setDiscoveryResult("Rate a few beans first so there's data to analyze.");setDiscoveryLoading(false);return;}
    const r=await callClaude("You are a coffee taste profile analyst. Be specific and concise.",
      `Based on this person's rated coffees, identify patterns in what they like and dislike, then suggest 3-4 specific varietals, processes, or origins they should seek out next, with brief reasoning.\n\nHOME COLLECTION:\n${rated||"none yet"}\n\nTRIED ELSEWHERE:\n${away||"none yet"}\n\nGive: 1) A short taste profile summary (2-3 sentences), 2) A bulleted list of what to try next with 1-line reasoning each.`);
    setDiscoveryResult(r);setDiscoveryLoading(false);
  };

  const startPointKey=cur?cur.id+"_"+method:"";

  const getStartingPoint=async()=>{
    if(!cur)return;
    setStartPointLoading(true);
    // Ground the suggestion in beans of a similar origin/process the person has already dialed in and rated,
    // so this isn't a generic recipe — it's informed by what's actually worked on this exact grinder/machine.
    const similar=beans.filter(b=>b.id!==cur.id&&b.rating>0&&(
      (cur.process&&b.process&&b.process.toLowerCase().includes(cur.process.toLowerCase().split(" ")[0]))||
      (cur.origin&&b.origin&&b.origin.toLowerCase().includes(cur.origin.toLowerCase().split(/[,&]/)[0].trim()))||
      (cur.roast&&b.roast===cur.roast)
    )).slice(0,4);
    const similarCtx=similar.map(b=>{
      const m=b.methods[method];
      const gl=b.grindLogs[method]?.slice(-1)[0];
      if(method==="espresso")return`${b.name} (${b.origin||"?"}, ${b.process||"?"}, ${b.roast||"?"}) rated ${b.rating}/10 — dialed at ${m.dose}g→${m.yield}g/${m.time}s/${m.temp}°F${gl?", grind "+grindLabel(gl.position):""}${m.notes?". Notes: "+m.notes:""}`;
      if(method==="aeropress")return`${b.name} (${b.origin||"?"}, ${b.process||"?"}, ${b.roast||"?"}) rated ${b.rating}/10 — dialed at ${m.dose}g/${m.water}g/${m.temp}°F, steep ${m.steepTime}s${gl?", grind "+grindLabel(gl.position):""}${m.notes?". Notes: "+m.notes:""}`;
      return`${b.name} (${b.origin||"?"}, ${b.process||"?"}, ${b.roast||"?"}) rated ${b.rating}/10 — dialed at ${m.dose}g/${m.water}g/${m.temp}°F${gl?", grind "+grindLabel(gl.position):""}${m.notes?". Notes: "+m.notes:""}`;

I want a starting point for ${methodLabel} on this bean. I haven't pulled a shot yet — don't waste my beans on a bad guess.

${similar.length?"Here's how similar beans from my collection are dialed in on this same grinder, which should inform the starting point:\n"+similarCtx:"No closely similar beans in my collection yet — base this on best practice for this origin/process/roast combination."}

Give me: dose, ${method==="espresso"?"yield, time, temp, pre-brew":"water amount, temp, "+(method==="aeropress"?"steep time, press time":"bloom amount/time, total time")}, and a starting grind setting on a 0-12 scale (0-1 range for espresso). One or two sentences of reasoning tied to the bean's specific process/origin. Keep it tight.`;
    const r=await callClaude(SYSTEM,prompt);

    setStartPointLoading(false);
  };

  const sortedBeans=[...beans].sort((a,b)=>{const ao=a.inStock===false,bo=b.inStock===false;if(ao!==bo)return ao?1:-1;return(b.rating||0)-(a.rating||0);});
  const imgUrl=cur?.imageBase64||cur?.imageUrl;

  return<div className="app">

      .timer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;}

      .timer-ring-wrap{position:relative;width:150px;height:150px;margin:0 auto 16px;}

      .timer-time{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--text);font-weight:500;font-family:'DM Mono',monospace;}

      .modal input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:16px;padding:10px 12px;outline:none;margin-bottom:12px;border-radius:0;-webkit-appearance:none;}
      .modal input:focus{border-color:var(--gold);}
      .empty{padding:40px 16px;text-align:center;color:var(--dim);font-size:14px;}
      .toast{position:fixed;bottom:18px;right:14px;background:var(--gold);color:var(--bg);font-family:'DM Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100;}
      .toast.show{opacity:1;}

      /* SCREEN NAV */
      .screen-nav{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex-shrink:0;}

      }
    `}</style>

    <div className="hdr">
      <div className="hdr-l">
        {isMobile&&!showList&&!adding&&!editing&&<button className="back" onClick={()=>{setShowList(true);}}>‹</button>}

              <span>Full Backup</span><span className="export-menu-sub">Everything, images included — larger</span>
            </button>
          </div>}
        </div>}
        <button className="btn icon kiosk-toggle-btn" onClick={()=>setKioskMode(k=>!k)} title="Display Mode">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <rect x="2" y="4" width="20" height="13" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
          </svg>

      {[["beans","Beans"],["compare","Compare"],["discovery","Discovery"],["away","Tasting Log"]].map(([id,label])=>
        <button key={id} className={"screen-tab"+(screen===id?" active":"")} onClick={()=>{setScreen(id);if(id==="beans"){setShowList(true);}}}>{label}</button>

    </div>}

    {screen==="beans"&&<div className="dl">
      {/* BEAN LIST */}
      <div className="list-wrap" style={(isMobile&&(!showList||adding||editing))?{display:"none"}:{width:isMobile?"100%":undefined}}>

          <div className="list-hdr-top">
            <div>
              <div className="list-hdr-title">Your Beans</div>

              <div className="bc-body">
                <div className="bc-name">{b.name}</div>

          <div className="sec-lbl" style={{marginBottom:8}}>Scan Bag Label</div>
          <div className="sec-txt" style={{marginBottom:10,fontSize:12}}>Take or upload a photo of the bag — roaster, origin, process, roast, and notes get read automatically.</div>
          <label className="btn ai photo-scan-btn">
            📷 Take Photo / Upload
            <input type="file" accept="image/*" style={{display:"none"}} onChange={handleBagPhoto}/>
          </label>
          {capturedPhoto&&<img src={capturedPhoto} alt="Scanned bag" className="photo-preview-img"/>}
          {photoLoading&&<div className="ai-loading" style={{marginTop:10}}><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>}
          {photoImport&&!photoImport.error&&<div style={{background:"#1a2818",border:"1px solid #3a5a28",padding:10,marginTop:10,fontSize:11,color:"var(--green)",lineHeight:1.6}}>✓ Read: {photoImport.name||"(name not found)"}{photoImport.roaster?" by "+photoImport.roaster:""} — check the fields below and fill in anything missing.</div>}
          {photoImport?.error&&<div style={{color:"var(--red)",fontSize:11,marginTop:10}}>{photoImport.error}</div>}
          <div className="div"/>

          <div style={{display:"flex",gap:8,marginBottom:10}}>

        </div>
        <EditForm draft={draft} setDraft={setDraft} method={method} updDraftM={updDraftM} adding={adding} saveNew={saveNew} saveEdit={saveEdit} setAdding={setAdding} setShowList={setShowList} setEditing={setEditing}/>
      </div>}

      {/* EDIT BEAN */}
      {editing&&cur&&<div className="detail" style={isMobile?{width:"100%"}:{}}>
        <div className="tc" style={{paddingTop:16}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontSize:18,color:"var(--gold)",marginBottom:4}}>Editing — {cur.name}</div>
          <div className="method-row" style={{margin:"0 -16px",width:"calc(100% + 32px)"}}>
            {METHODS.map(m=><button key={m} className={"method-btn"+(method===m?" active":"")} onClick={()=>setMethod(m)}>{METHOD_LABELS[m]}</button>)}
          </div>
        </div>
        <EditForm draft={draft} setDraft={setDraft} method={method} updDraftM={updDraftM} adding={adding} saveNew={saveNew} saveEdit={saveEdit} setAdding={setAdding} setShowList={setShowList} setEditing={setEditing}/>
      </div>}

      {/* BEAN DETAIL */}
      {!adding&&!editing&&<div className="detail" style={(isMobile&&showList)?{display:"none"}:{}}>
        {!cur&&<div className="empty" style={{paddingTop:80}}>← Select a bean</div>}
        {cur&&<>
          <div className="bean-hero">
            {imgUrl&&<img src={imgUrl} alt={cur.name} className="bean-hero-img" style={{objectPosition:`${cur.imageOffsetX??50}% ${cur.imageOffsetY??50}%`,transform:`scale(${(cur.imageZoom||100)/100})`}} onError={e=>e.target.style.display="none"}/>}
            <div className="bean-hero-content">
              <div className="bean-title">{cur.name}</div>
              <div className="bean-roaster-lbl">{cur.roaster}</div>
              {cur.roastDate&&<div className="roast-date">{daysAgo(cur.roastDate)||fmtDate(cur.roastDate)}{daysAgo(cur.roastDate)&&<span className="roast-date-exact"> · {fmtDate(cur.roastDate)}</span>}{freshness(cur.roastDate)&&<span className="fresh-badge" style={{color:freshness(cur.roastDate).color,borderColor:freshness(cur.roastDate).color}}>{freshness(cur.roastDate).label}</span>}</div>}
              <div className="bean-actions">
                <button className="btn sm" style={{borderColor:cur.inStock!==false?"#3a5a28":"#5a2a2a",color:cur.inStock!==false?"var(--green)":"var(--red)"}} onClick={()=>updB("inStock",cur.inStock===false)}>
                  {cur.inStock!==false?"✓ In Stock":"✗ Out of Stock"}
                </button>
                <button className="btn sm" style={{borderColor:"#3a4a6a",color:"var(--blue)",background:cur.currentlyBrewing?"#1a2038":"transparent"}} onClick={()=>upd(bs=>bs.map(b=>({...b,currentlyBrewing:b.id===selId?!cur.currentlyBrewing:(!cur.currentlyBrewing?false:b.currentlyBrewing)})))}>
                  {cur.currentlyBrewing?"☕ Brewing Now":"Set as Current"}
                </button>
              </div>
              <div className="pills">
                {cur.origin&&<span className="pill">{cur.origin}</span>}
                {cur.process&&<span className="pill">{cur.process}</span>}
                {cur.roast&&<span className="pill">{cur.roast}</span>}
                {cur.altitude&&<span className="pill">{cur.altitude}</span>}
              </div>
              <StarRating value={cur.rating||0} onChange={v=>updB("rating",v)}/>
            </div>
          </div>

          <div className="method-row">
            {METHODS.map(m=><button key={m} className={"method-btn"+(method===m?" active":"")} onClick={()=>{setMethod(m);setTab("shot");setDiagInput("");setCompass(null);setShotTime("");setShotYield("");setDiagFollowup("");setLastDiagCtx("");}}>
              {METHOD_LABELS[m]}
            </button>)}
          </div>

          <div className="tabs">
            {["shot","grind",...(method!=="espresso"?["recipe"]:[]),"diagnose","info"].map(t=><button key={t} className={"tab"+(tab===t?" active":"")} onClick={()=>setTab(t)}>
              {t==="recipe"?"Recipes":t==="info"?"Bean Info":t.charAt(0).toUpperCase()+t.slice(1)}
            </button>)}
            <button className="tab" onClick={startEdit}>Edit</button>
          </div>

          <div className="tc">
            {tab==="shot"&&<>
              {method==="espresso"&&<div className="pg">
                <ShotParam label="Dose" value={md.dose} unit="g" onSave={v=>updM("dose",v)} options={DOSES_ESP}/>
                <ShotParam label="Yield" value={md.yield} unit="g" onSave={v=>updM("yield",v)} options={YIELD_OPTS}/>
                <ShotParam label="Time" value={md.time} unit="s" onSave={v=>updM("time",v)} options={TIME_OPTS}/>
                <ShotParam label="Temp" value={md.temp} unit="°F" onSave={v=>updM("temp",v)} options={TEMPS}/>
                <ShotParam label="Pre-brew" value={md.preBrew} onSave={v=>updM("preBrew",v)} wide small/>
              </div>}
              {method==="aeropress"&&<>
                <button className="btn timer-btn" onClick={()=>launchTimer("aeropress")}>▶ Start AeroPress Timer</button>
                <div className="pg">
                  <ShotParam label="Dose" value={md.dose} unit="g" onSave={v=>updM("dose",v)} options={DOSES_MAN}/>
                  <ShotParam label="Water" value={md.water} unit="g" onSave={v=>updM("water",v)} options={WATER_OPTS}/>
                  <ShotParam label="Temp" value={md.temp} unit="°F" onSave={v=>updM("temp",v)} options={TEMPS}/>
                  <ShotParam label="Steep" value={md.steepTime} unit="s" onSave={v=>updM("steepTime",v)} options={STEEP_OPTS}/>
                  <ShotParam label="Press" value={md.pressTime} unit="s" onSave={v=>updM("pressTime",v)} options={["20","25","30","35","40","45","60"].map(v=>({value:v,label:v+"s"}))}/>
                  <div className="pm"><div className="pm-lbl">Inverted</div><div className="pm-val sm">{md.inverted?"Yes":"No"}</div></div>
                  <div className="pm w"><div className="pm-lbl">Bloom</div><div className="pm-val sm">{md.bloom?"Yes — "+md.bloomTime+"s":"No"}</div></div>
                </div>
                {(()=>{const r=cur.savedRecipes?.aeropress||[];const last=r.slice(-1)[0];return last?<div style={{marginBottom:14}}><div className="sec-lbl" style={{marginBottom:6}}>Active Recipe</div><div className="saved-recipe"><div className="saved-recipe-date">{last.date}</div><div className="saved-recipe-text">{last.text}</div><button className="btn sm" onClick={()=>setTab("recipe")}>View All →</button></div></div>:null;})()}
              </>}
              {method==="pourover"&&<>
                <button className="btn timer-btn" onClick={()=>launchTimer("pourover")}>▶ Start Pour Over Timer</button>
                <div className="pg">
                  <ShotParam label="Dose" value={md.dose} unit="g" onSave={v=>updM("dose",v)} options={DOSES_MAN}/>
                  <ShotParam label="Water" value={md.water} unit="g" onSave={v=>updM("water",v)} options={WATER_OPTS}/>
                  <ShotParam label="Temp" value={md.temp} unit="°F" onSave={v=>updM("temp",v)} options={TEMPS}/>
                  <ShotParam label="Bloom" value={md.bloomAmount?(md.bloomAmount+"g/"+md.bloomTime+"s"):"—"} onSave={v=>updM("bloomAmount",v)} wide small/>
                  <ShotParam label="Total Time" value={md.totalTime} onSave={v=>updM("totalTime",v)}/>
                </div>
                {(()=>{const r=cur.savedRecipes?.pourover||[];const last=r.slice(-1)[0];return last?<div style={{marginBottom:14}}><div className="sec-lbl" style={{marginBottom:6}}>Active Recipe</div><div className="saved-recipe"><div className="saved-recipe-date">{last.date}</div><div className="saved-recipe-text">{last.text}</div><button className="btn sm" onClick={()=>setTab("recipe")}>View All →</button></div></div>:null;})()}
              </>}
              <div className="grind-inline">
                <div><div className="gi-lbl">Current Grind</div>{lg?<><div className="gi-val">{grindLabel(lg.position)}</div>{lg.note&&<div className="gi-sub">{lg.note}</div>}</>:<div className="gi-none">Not logged</div>}</div>
                <button className="btn sm" onClick={()=>setTab("grind")}>{lg?"History":"Log"}</button>
              </div>
              {!lg&&!md.notes&&<div className="start-point-box">
                {!startPointResult[startPointKey]&&<>
                  <div className="sec-lbl" style={{marginBottom:6}}>Haven't Pulled This Yet</div>
                  <div className="sec-txt" style={{marginBottom:10,fontSize:13}}>Get an AI starting point grounded in how your similar beans are dialed in, so your first pull isn't a guess.</div>
                  <button className="btn ai" disabled={startPointLoading} onClick={getStartingPoint}>{startPointLoading?"Thinking...":"Get Starting Point"}</button>
                </>}
                {startPointLoading&&<div className="ai-loading" style={{marginTop:10}}><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>}
                {startPointResult[startPointKey]&&<div className="ai-box" style={{marginTop:startPointResult[startPointKey]?0:10}}>
                  <div className="ai-lbl">Suggested Starting Point</div>
                  <div className="ai-result">{cleanMd(startPointResult[startPointKey])}</div>
                  <button className="btn sm" style={{marginTop:10}} onClick={()=>setStartPointResult(prev=>({...prev,[startPointKey]:null}))}>Clear</button>
                </div>}
              </div>}
              {md.notes&&<div className="sec"><div className="sec-lbl">Tasting Notes</div><div className="sec-txt">{md.notes}</div></div>}
              {md.whatWorked&&<div className="sec"><div className="sec-lbl">What Worked</div><div className="sec-txt" style={{color:"var(--green)"}}>{md.whatWorked}</div></div>}
              {md.whatDidnt&&<div className="sec"><div className="sec-lbl">What Didn't</div><div className="sec-txt" style={{color:"var(--red)"}}>{md.whatDidnt}</div></div>}
              {method==="espresso"&&md.iced&&<div className="sec"><div className="sec-lbl">Iced</div><div className="sec-txt" style={{color:"var(--blue)"}}>{md.iced}</div></div>}
              <div className="div"/>
              <button className="btn d sm" onClick={()=>delBean(cur.id)}>Delete Bean</button>
            </>}

            {tab==="grind"&&<>
              <div className="sec-lbl" style={{marginBottom:10}}>Grind Log — {METHOD_LABELS[method]}</div>
              {!addingGrind&&<button className="btn p sm" style={{marginBottom:13}} onClick={()=>{setAddingGrind(true);setGrindDraft({position:{whole:method==="espresso"?0:7,dot:0},note:"",date:""});}}>+ Log Grind</button>}
              {addingGrind&&<div className="ga-form">
                <div className="sec-lbl" style={{marginBottom:8}}>Position ({method==="espresso"?"0–1 calibrated":"0–12 full range"})</div>
                <GrindSelector value={grindDraft.position} onChange={p=>setGrindDraft(g=>({...g,position:p}))}/>
                <div style={{marginTop:12,display:"grid",gridTemplateColumns:"minmax(0,1fr) minmax(0,1fr)",gap:10}}>
                  <Field label="Date" value={grindDraft.date} onChange={v=>setGrindDraft(g=>({...g,date:v}))}/>
                  <div style={{gridColumn:"1/-1"}}><Field label="Notes" value={grindDraft.note} onChange={v=>setGrindDraft(g=>({...g,note:v}))} multiline/></div>
                </div>
                <div className="fa" style={{marginTop:10}}>
                  <button className="btn p sm" onClick={saveGrind}>Save</button>
                  <button className="btn sm" onClick={()=>setAddingGrind(false)}>Cancel</button>
                </div>
              </div>}
              {!cur.grindLogs?.[method]?.length&&!addingGrind&&<div className="empty-grind">No grind entries yet</div>}
              <div className="gl">
                {[...(cur.grindLogs?.[method]||[])].reverse().map((g,i)=><div key={g.id} className="ge">
                  <div><div className="ge-pos">{grindLabel(g.position)}</div><div className="ge-date">{g.date}</div>{i===0&&<div className="ge-badge">Current</div>}{g.note&&<div className="ge-note">{g.note}</div>}</div>
                  <button className="btn d sm" onClick={()=>delGrind(g.id)}>✕</button>
                </div>)}
              </div>
            </>}

            {tab==="recipe"&&method!=="espresso"&&<>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div className="sec-lbl">{METHOD_LABELS[method]} Recipes</div>
                <button className="btn sm" style={{background:"#1a2a1a",borderColor:"#3a5a3a",color:"var(--green)"}} onClick={()=>launchTimer(method)}>▶ Timer</button>
              </div>
              {(cur.savedRecipes?.[method]||[]).length>0&&<div style={{marginBottom:16}}>
                <div className="sec-lbl" style={{marginBottom:8}}>Saved Recipes</div>
                {[...(cur.savedRecipes[method])].reverse().map((r,i)=><div key={r.id} className="saved-recipe">
                  <div className="saved-recipe-date">{r.date}</div>
                  <div className="saved-recipe-text">{r.text}</div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <button className="btn sm" style={{borderColor:"var(--green)",color:"var(--green)"}} onClick={()=>applyRecipe(r.text)}>Apply to Shot</button>
                    <button className="btn sm" style={{borderColor:"var(--purple)",color:"var(--purple)"}} onClick={()=>{setActiveRecipeIdx(cur.savedRecipes[method].length-1-i);setRecipeFeedback("");}}>Refine</button>
                    <button className="btn d sm" onClick={()=>delRecipe(method,r.id)}>Delete</button>
                  </div>
                  {activeRecipeIdx===(cur.savedRecipes[method].length-1-i)&&<div style={{marginTop:10}}>
                    <textarea className="ai-ta" rows={2} placeholder="What to change? e.g. 'Less acidic' or 'More body'..." value={recipeFeedback} onChange={e=>setRecipeFeedback(e.target.value)}/>
                    <button className="btn ai" disabled={aiLoading||!recipeFeedback.trim()} onClick={()=>genRecipe(recipeFeedback)}>{aiLoading?"Refining...":"Refine Recipe"}</button>
                  </div>}
                </div>)}
                <div className="div"/>
              </div>}
              <div className="sec-lbl" style={{marginBottom:6}}>Generate New Recipe</div>
              <div className="sec-txt" style={{marginBottom:10,fontSize:12}}>For {cur.name} ({cur.roast}, {cur.process}).</div>
              <textarea className="ai-ta" rows={2} placeholder="Optional: 'bright and fruity' or 'lower acidity'..." value={recipeCtx} onChange={e=>setRecipeCtx(e.target.value)}/>
              <div className="fa" style={{marginBottom:14}}>
                <button className="btn ai" disabled={aiLoading} onClick={()=>genRecipe(null)}>{aiLoading?"Generating...":"Generate Recipe"}</button>
                {aiResult&&<button className="btn sm" onClick={()=>setAiResult("")}>Clear</button>}
              </div>
              <AiBox showSave={true}/>
            </>}

            {tab==="diagnose"&&<>
              <Compass onSelect={setCompass} selected={compass}/>
              <div className="diag-row">
                <div><span className="diag-label">Shot Time (s)</span><input className="diag-input" value={shotTime} onChange={e=>setShotTime(e.target.value)} placeholder="e.g. 32"/></div>
                <div><span className="diag-label">Actual Yield (g)</span><input className="diag-input" value={shotYield} onChange={e=>setShotYield(e.target.value)} placeholder="e.g. 36"/></div>
              </div>
              <div className="sec-lbl" style={{marginBottom:6}}>Describe Your Cup</div>
              <textarea className="ai-ta" rows={3} placeholder={method==="espresso"?"Taste, texture, finish...":method==="aeropress"?"e.g. 'Muddy, over-extracted...'":"e.g. 'Flat, no clarity...'"} value={diagInput} onChange={e=>setDiagInput(e.target.value)}/>
              <div className="fa" style={{marginBottom:14}}>
                <button className="btn ai" disabled={aiLoading||(!diagInput.trim()&&!compass)} onClick={()=>runDiagnosis()}>{aiLoading?"Diagnosing...":"Diagnose"}</button>
                {(aiResult||diagInput||compass)&&<button className="btn sm" onClick={()=>{setAiResult("");setDiagInput("");setCompass(null);setShotTime("");setShotYield("");setDiagFollowup("");setLastDiagCtx("");}}>Clear</button>}
              </div>
              <AiBox/>
              {aiResult&&!aiLoading&&<div style={{marginTop:-4,marginBottom:14}}>
                <div className="sec-lbl" style={{marginBottom:6}}>Made an adjustment? Pull again and tell me what happened</div>
                <textarea className="ai-ta" rows={2} placeholder="e.g. 'Went finer to 0·, shot ran 34s now, still a bit sour' or 'Fixed puck prep, tastes much better now'" value={diagFollowup} onChange={e=>setDiagFollowup(e.target.value)}/>
                <button className="btn ai" disabled={aiLoading||!diagFollowup.trim()} onClick={()=>runDiagnosis(diagFollowup)}>{aiLoading?"Checking...":"Get Next Step"}</button>
              </div>}
            </>}

            {tab==="info"&&<>
              {(cur.altitude||cur.varietal||cur.flavorProfile)&&<div className="pg" style={{marginBottom:14}}>
                {cur.altitude&&<div className="pm"><div className="pm-lbl">Altitude</div><div className="pm-val sm">{cur.altitude}</div></div>}
                {cur.varietal&&<div className="pm"><div className="pm-lbl">Varietal</div><div className="pm-val sm">{cur.varietal}</div></div>}
                {cur.flavorProfile&&<div className="pm w"><div className="pm-lbl">Flavor Profile</div><div className="pm-val sm">{cur.flavorProfile}</div></div>}
              </div>}
              <div className="div"/>
              <BeanInfoSheet key={cur.id} bean={cur}/>
            </>}
          </div>
        </>}
      </div>}
    </div>}

    {screen==="compare"&&<div className="screen-body">
      <div className="tc">
        <div className="sec-lbl" style={{marginBottom:10}}>Compare Beans</div>
        <div className="sec-txt" style={{marginBottom:12,fontSize:12}}>Pick up to two beans to compare side by side.</div>
        <div className="compare-picker">
          {sortedBeans.map(b=><button key={b.id} className={"compare-chip"+(compareIds.includes(b.id)?" sel":"")} onClick={()=>toggleCompare(b.id)}>{b.name}</button>)}
        </div>
        {compareIds.length===0&&<div className="empty-grind" style={{marginTop:20}}>Select beans above to compare</div>}
        {compareIds.length>0&&<div className="compare-grid" style={{marginTop:16}}>
          {compareIds.map(id=>{
            const b=beans.find(x=>x.id===id);
            if(!b)return null;
            const e=b.methods.espresso;
            return<div key={id} className="compare-col">
              <div className="compare-name">{b.name}</div>
              <div className="compare-roaster">{b.roaster}</div>
              {b.rating>0&&<div className="bc-rating" style={{marginBottom:8}}>{"★".repeat(Math.round(b.rating/2))} {b.rating}/10</div>}
              <div className="compare-row"><span>Origin</span><span>{b.origin||"—"}</span></div>
              <div className="compare-row"><span>Process</span><span>{b.process||"—"}</span></div>
              <div className="compare-row"><span>Roast</span><span>{b.roast||"—"}</span></div>
              <div className="compare-row"><span>Altitude</span><span>{b.altitude||"—"}</span></div>
              <div className="compare-row"><span>Flavor</span><span>{b.flavorProfile||"—"}</span></div>
              <div className="div" style={{margin:"10px 0"}}/>
              <div className="compare-row"><span>Dose→Yield</span><span>{e.dose}g→{e.yield}g</span></div>
              <div className="compare-row"><span>Time</span><span>{e.time}s</span></div>
              <div className="compare-row"><span>Temp</span><span>{e.temp}°F</span></div>
              {e.notes&&<div className="compare-notes">{e.notes}</div>}
            </div>;
          })}
        </div>}
      </div>
    </div>}

    {screen==="discovery"&&<div className="screen-body">
      <div className="tc">
        <div className="sec-lbl" style={{marginBottom:6}}>Your Taste Profile</div>
        <div className="sec-txt" style={{marginBottom:14,fontSize:12}}>A snapshot of what you've tried and what you tend to love.</div>
        {(()=>{
          const ratedBeans=beans.filter(b=>b.rating>0).map(b=>({name:b.name,rating:b.rating}));
          const ratedAway=awayLog.filter(a=>a.rating>0).map(a=>({name:a.name,rating:a.rating}));
          const allRated=[...ratedBeans,...ratedAway];
          const totalTried=beans.length+awayLog.length;
          const avgRating=allRated.length?(allRated.reduce((s,b)=>s+b.rating,0)/allRated.length):null;
          const topBean=[...allRated].sort((a,b)=>b.rating-a.rating)[0];
          const groupBy=(items,field,sortByRating)=>{
            const map={};
            items.forEach(b=>{const key=(b[field]&&b[field].trim())||"Unknown";map[key]=map[key]||{sum:0,n:0,rated:0};map[key].sum+=(b.rating||0);map[key].n++;if(b.rating>0)map[key].rated++;});
            const rows=Object.entries(map).map(([k,v])=>({k,avg:v.rated?v.sum/v.rated:0,n:v.n}));
            return sortByRating?rows.sort((a,b)=>b.avg-a.avg||b.n-a.n):rows.sort((a,b)=>b.n-a.n);
          };
          // Tasting Log entries count toward the profile too, even before a bag is bought.
          const allTried=[...beans,...awayLog.map(a=>({origin:a.origin,process:a.process,roast:a.roast,rating:a.rating||0}))];
          const originRows=groupBy(allTried,"origin",false).slice(0,6);
          const procRows=groupBy(allTried,"process",true).slice(0,6);
          const roastRows=groupBy(allTried,"roast",true).slice(0,6);
          const palette=["#d4aa7a","#90b878","#789ab8","#c07878","#b8a0e0","#c8c040"];

          const DonutChart=({rows})=>{
            const total=rows.reduce((s,r)=>s+r.n,0)||1;
            let cumulative=0;
            const R=15.9,C=2*Math.PI*R;
            return<div className="donut-wrap">
              <svg viewBox="0 0 36 36" className="donut-svg">
                <circle cx="18" cy="18" r={R} fill="none" stroke="var(--border)" strokeWidth="4"/>
                {rows.map((r,i)=>{
                  const frac=r.n/total;
                  const dash=frac*C;
                  const gap=C-dash;
                  const offset=-cumulative*C;
                  cumulative+=frac;
                  return<circle key={r.k} cx="18" cy="18" r={R} fill="none" stroke={palette[i%palette.length]} strokeWidth="4" strokeDasharray={`${dash} ${gap}`} strokeDashoffset={offset} transform="rotate(-90 18 18)"/>;
                })}
              </svg>
              <div className="donut-legend">
                {rows.map((r,i)=><div key={r.k} className="donut-legend-row"><span className="donut-dot" style={{background:palette[i%palette.length]}}/><span className="donut-legend-lbl">{r.k}</span><span className="donut-legend-n">{r.n}</span></div>)}
              </div>
            </div>;
          };

          const TopRated=({rows,title})=><div style={{marginBottom:16}}>
            <div className="sec-lbl" style={{marginBottom:8}}>{title}</div>
            {rows.length===0?<div className="empty-grind">Not enough data yet</div>:
              <div className="rank-list">
                {rows.slice(0,5).map((r,i)=><div key={r.k} className="rank-row">
                  <span className="rank-num">{i+1}</span>
                  <span className="rank-lbl">{r.k}</span>
                  <span className="rank-n">{r.n} tried</span>
                  {r.avg>0&&<span className="rank-avg">{r.avg.toFixed(1)}</span>}
                </div>)}
              </div>}
          </div>;

          return<>
            <div className="stat-row">
              <div className="stat-box"><div className="stat-num">{totalTried}</div><div className="stat-lbl">Beans Tried</div></div>
              <div className="stat-box"><div className="stat-num">{avgRating?avgRating.toFixed(1):"—"}</div><div className="stat-lbl">Avg Rating</div></div>
              <div className="stat-box"><div className="stat-num" style={{fontSize:13,lineHeight:1.3}}>{topBean?topBean.name:"—"}</div><div className="stat-lbl">Top Rated</div></div>
            </div>
            {allRated.length===0?<div className="empty-grind" style={{marginTop:14}}>Rate a few beans to see your profile</div>:<>
              <div className="sec-lbl" style={{marginBottom:8,marginTop:18}}>Origin Mix</div>
              <DonutChart rows={originRows}/>
              <TopRated rows={procRows} title="Top Processes"/>
              <TopRated rows={roastRows} title="Top Roast Levels"/>
            </>}
          </>;
        })()}
        <div className="div"/>
        <div className="sec-lbl" style={{marginBottom:8}}>AI Recommendations</div>
        <button className="btn ai" disabled={discoveryLoading} onClick={runDiscovery}>{discoveryLoading?"Analyzing...":"Analyze & Recommend"}</button>
        {discoveryLoading&&<div className="ai-loading" style={{marginTop:10}}><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>}
        {discoveryResult&&<div className="ai-box" style={{marginTop:12}}><div className="ai-lbl">Result</div><div className="ai-result">{cleanMd(discoveryResult)}</div></div>}
      </div>
    </div>}

    {screen==="away"&&<div className="screen-body">
      <div className="tc">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
          <div className="sec-lbl">Tasting Log</div>
          {!addingAway&&<button className="btn p sm" onClick={()=>{setAddingAway(true);setAwayPhotoImport(null);setAwayCapturedPhoto(null);}}>+ Log One</button>}
        </div>
        <div className="sec-txt" style={{marginBottom:14,fontSize:12}}>Quick log for coffee you tried at a cafe or elsewhere — no params needed.</div>
        {addingAway&&<div className="ga-form">
          <div className="sec-lbl" style={{marginBottom:8}}>Scan Bag or Menu</div>
          <label className="btn ai photo-scan-btn">
            📷 Take Photo / Upload
            <input type="file" accept="image/*" style={{display:"none"}} onChange={handleAwayPhoto}/>
          </label>
          {awayCapturedPhoto&&<img src={awayCapturedPhoto} alt="Scanned label" className="photo-preview-img"/>}
          {awayPhotoLoading&&<div className="ai-loading" style={{marginTop:10}}><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>}
          {awayPhotoImport&&!awayPhotoImport.error&&<div style={{background:"#1a2818",border:"1px solid #3a5a28",padding:10,marginTop:10,marginBottom:12,fontSize:11,color:"var(--green)",lineHeight:1.6}}>✓ Read: {awayPhotoImport.name||"(name not found)"}{awayPhotoImport.roaster?" by "+awayPhotoImport.roaster:""} — check fields below.</div>}
          {awayPhotoImport?.error&&<div style={{color:"var(--red)",fontSize:11,marginTop:10,marginBottom:12}}>{awayPhotoImport.error}</div>}
          <div className="div"/>
          <div className="fg">
            <Field label="Bean / Coffee Name" value={awayDraft.name} onChange={v=>setAwayDraft(d=>({...d,name:v}))}/>
            <Field label="Roaster" value={awayDraft.roaster} onChange={v=>setAwayDraft(d=>({...d,roaster:v}))}/>
            <Field label="Where" value={awayDraft.place} onChange={v=>setAwayDraft(d=>({...d,place:v}))} placeholder="Cafe or location"/>
            <Field label="Method" value={awayDraft.method} onChange={v=>setAwayDraft(d=>({...d,method:v}))} placeholder="Pour over, espresso..."/>
            <Field label="Origin" value={awayDraft.origin} onChange={v=>setAwayDraft(d=>({...d,origin:v}))}/>
            <Field label="Process" value={awayDraft.process} onChange={v=>setAwayDraft(d=>({...d,process:v}))}/>
            <Field label="Roast Level" value={awayDraft.roast} onChange={v=>setAwayDraft(d=>({...d,roast:v}))}/>
            <Field label="Date" value={awayDraft.date} onChange={v=>setAwayDraft(d=>({...d,date:v}))} placeholder="Leave blank for today"/>
            <div className="field full"><Field label="Flavor Profile" value={awayDraft.flavorProfile} onChange={v=>setAwayDraft(d=>({...d,flavorProfile:v}))}/></div>
            <div className="field full"><Field label="Notes" value={awayDraft.notes} onChange={v=>setAwayDraft(d=>({...d,notes:v}))} multiline placeholder="What you liked, want to remember..."/></div>
          </div>
          <div className="sec-lbl" style={{marginBottom:6}}>Rating</div>
          <StarRating value={awayDraft.rating} onChange={v=>setAwayDraft(d=>({...d,rating:v}))}/>
          <div className="fa" style={{marginTop:10}}>
            <button className="btn p sm" onClick={addAway}>Save</button>
            <button className="btn sm" onClick={()=>{setAddingAway(false);setAwayPhotoImport(null);setAwayCapturedPhoto(null);}}>Cancel</button>
          </div>
        </div>}
        {awayLog.length===0&&!addingAway&&<div className="empty-grind">Nothing logged yet</div>}
        <div className="gl" style={{marginTop:awayLog.length?12:0}}>
          {awayLog.map(a=><div key={a.id} className="ge">
            <div>
              <div className="ge-pos" style={{fontSize:15,letterSpacing:0}}>{a.name}</div>
              <div className="ge-date">{[a.roaster,a.place].filter(Boolean).join(" · ")} {a.date&&"· "+a.date}</div>
              {(a.origin||a.process||a.roast)&&<div className="ge-note">{[a.origin,a.process,a.roast].filter(Boolean).join(" | ")}</div>}
              {a.flavorProfile&&<div className="ge-note">{a.flavorProfile}</div>}
              {a.notes&&<div className="ge-note">{a.notes}</div>}
              {a.rating>0&&<div className="bc-rating" style={{marginTop:4}}>{"★".repeat(Math.round(a.rating/2))} {a.rating}/10</div>}
            </div>
            <button className="btn d sm" onClick={()=>delAway(a.id)}>✕</button>
          </div>)}
        </div>
      </div>
    </div>}

    {kioskMode&&<div className="kiosk-view">
      <div className="kiosk-hdr"><h1>Coffee Bar</h1><button className="btn sm" onClick={()=>setKioskMode(false)}>Exit Display</button></div>
      <div className="kiosk-grid">
        {sortedBeans.filter(b=>b.inStock!==false).map(b=>{
          const img=b.imageBase64||b.imageUrl;
          return<div key={b.id} className={"kiosk-card"+(b.currentlyBrewing?" brewing":"")} onClick={()=>{setSelId(b.id);setKioskMode(false);setScreen("beans");setShowList(false);}}>
            <div className="kiosk-card-img">{img?<img src={img} alt={b.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"☕"}</div>
            <div className="kiosk-card-body">
              <div className="kiosk-card-name">{b.name}</div>
              <div className="kiosk-card-roaster">{b.roaster}</div>
              <div className="kiosk-card-meta">{[b.origin,b.process,b.roast].filter(Boolean).join(" · ")}</div>
              {b.flavorProfile&&<div className="kiosk-card-flavor">{b.flavorProfile}</div>}
              {b.rating>0&&<div className="bc-rating">{"★".repeat(Math.round(b.rating/2))} {b.rating}/10</div>}
              {b.currentlyBrewing&&<div className="bc-badge brewing" style={{display:"inline-block",marginTop:6}}>Brewing Now</div>}
            </div>
          </div>;
        })}
      </div>
    </div>}

    {showTimer&&<TimerModal stages={timerStages} onClose={()=>setShowTimer(false)}/>}

    {showApiModal&&<div className="modal-overlay" onClick={()=>setShowApiModal(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>API Key</h2>
        <p>Required for AI features. Stored on this device only.</p>
        <p>Get your key at <strong>console.anthropic.com</strong></p>
        {window._COFFEE_API_KEY?<p style={{color:"var(--green)",marginBottom:8,fontSize:11}}>✓ Key active: {window._COFFEE_API_KEY.slice(0,14)}...</p>:<p style={{color:"var(--red)",marginBottom:8,fontSize:11}}>✗ No key saved</p>}
        <input type="text" placeholder="sk-ant-api03-..." value={apiKeyInput} onChange={e=>setApiKeyInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveApiKey()}/>
        <div className="fa" style={{marginBottom:12}}>
          <button className="btn p" onClick={saveApiKey}>Save Key</button>
          <button className="btn" onClick={()=>setShowApiModal(false)}>Cancel</button>
        </div>
        <div style={{borderTop:"1px solid var(--border)",paddingTop:12}}>
          <button className="btn ai" style={{width:"100%"}} onClick={async()=>{window._COFFEE_API_KEY=apiKeyInput.trim()||window._COFFEE_API_KEY;const r=await callClaude("You are a helpful assistant.","Say only: API key working!");alert(r);}}>Test Connection</button>
        </div>
      </div>
    </div>}

    {showImportModal&&<div className="modal-overlay" onClick={()=>setShowImportModal(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>Import Beans</h2>
        <p>Paste exported bean data below — includes images and every field. Beans already in your collection (same name + roaster) will be skipped.</p>
        <textarea value={importText} onChange={e=>setImportText(e.target.value)} placeholder="Paste exported text here..." style={{width:"100%",height:140,background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",fontFamily:"'DM Mono',monospace",fontSize:13,padding:"10px 12px",outline:"none",resize:"none",borderRadius:0,marginBottom:12,WebkitAppearance:"none",display:"block"}}/>
        {importStatus&&<p style={{color:importStatus.includes("Error")||importStatus.includes("No beans")?"var(--red)":"var(--green)",marginBottom:10}}>{importStatus}</p>}
        <div className="fa">
          <button className="btn p" onClick={importFromText} disabled={!importText.trim()}>Import</button>
          <button className="btn" onClick={()=>{setShowImportModal(false);setImportText("");setImportStatus("");}}>Cancel</button>
        </div>
      </div>
    </div>}

    <div className={"toast"+(copied?" show":"")}>Copied!</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

  espresso: { dose: "18", yield: "36", time: "28", temp: "200.5", preBrew: "2s on / 2s off", notes: "", whatWorked: "", whatDidnt: "", iced: "" },

  pourover: { dose: "20", water: "300", temp: "205", bloomAmount: "40", bloomTime: "45", pours: "", totalTime: "3:30", notes: "", whatWorked: "", whatDidnt: "" },
};

// ── GRIND ──────────────────────────────────────────────────────────────────
function grindLabel(pos) {
  if (!pos) return "—";
  if (pos.dot === 0) return String(pos.whole);
  return pos.whole + "·".repeat(pos.dot);
}

function GrindSelector({ value, onChange }) {
  const cur = value || { whole: 0, dot: 0 };
  const groups = [];
  for (let w = 0; w <= GRIND_MAX; w++) {
    const maxDot = w === GRIND_MAX ? 0 : DOTS;
    const g = [];
    for (let d = 0; d <= maxDot; d++) g.push({ whole: w, dot: d });
    groups.push(g);
  }
  const isSel = (p) => cur.whole === p.whole && cur.dot === p.dot;
  return (
    <div className="grind-groups">
      {groups.map((g, wi) => (
        <div key={wi} className="grind-group">
          {g.map((p, i) => (
            <button key={i} className={"grind-pos" + (isSel(p) ? " active" : "") + (p.dot === 0 ? " whole" : "")} onClick={() => onChange(p)}>
              {grindLabel(p)}
            </button>
          ))}
        </div>
      ))}
    </div>
  );
}

// ── INLINE EDITABLE PARAM ─────────────────────────────────────────────────
function EditableParam({ label, value, unit, onSave, wide, small }) {
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(value);
  const inputRef = useRef(null);
  useEffect(() => { if (editing) { setDraft(value); setTimeout(() => inputRef.current && inputRef.current.select(), 50); } }, [editing]);
  const commit = () => { onSave(draft); setEditing(false); };
  return (
    <div className={"pm" + (wide ? " w" : "")} onClick={() => !editing && setEditing(true)} style={{ cursor: "pointer" }}>
      <div className="pm-lbl">{label} <span style={{ color: "var(--dim)", fontSize: 7 }}>tap to edit</span></div>
      {editing ? (
        <input ref={inputRef} className="pm-input" value={draft} onChange={e => setDraft(e.target.value)}
          onBlur={commit} onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }}
          onClick={e => e.stopPropagation()} />
      ) : (
        <div className={"pm-val" + (small ? " sm" : "")}>{value || "—"}{unit && <span className="pm-unit">{unit}</span>}</div>
      )}
    </div>
  );
}

// ── TIMER ─────────────────────────────────────────────────────────────────
function Timer({ stages, onClose }) {
  const [stageIdx, setStageIdx] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [running, setRunning] = useState(false);
  const [done, setDone] = useState(false);
  const intervalRef = useRef(null);
  const stage = stages[stageIdx];
  const total = stage ? parseInt(stage.duration) || 0 : 0;
  const remaining = Math.max(0, total - elapsed);

  useEffect(() => {
    if (running && !done) {
      intervalRef.current = setInterval(() => {
        setElapsed(e => {
          const next = e + 1;
          if (next >= total) {
            clearInterval(intervalRef.current);
            // Auto-advance or finish
            if (stageIdx < stages.length - 1) {
              setTimeout(() => { setStageIdx(i => i + 1); setElapsed(0); setRunning(true); }, 800);
            } else {
              setDone(true); setRunning(false);
            }
            return total;
          }
          return next;
        });
      }, 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [running, stageIdx, total, done]);

  const start = () => { setRunning(true); };
  const reset = () => { clearInterval(intervalRef.current); setStageIdx(0); setElapsed(0); setRunning(false); setDone(false); };
  const pct = total > 0 ? (elapsed / total) * 100 : 0;
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;

  return (
    <div className="timer-overlay" onClick={onClose}>
      <div className="timer-modal" onClick={e => e.stopPropagation()}>
        <div className="timer-stage-name">{done ? "Done!" : stage ? stage.name : ""}</div>
        <div className="timer-stages-row">
          {stages.map((s, i) => (
            <div key={i} className={"timer-stage-pip" + (i === stageIdx ? " active" : "") + (i < stageIdx ? " done" : "")}>{s.name}</div>
          ))}
        </div>
        <div className="timer-ring-wrap">
          <svg viewBox="0 0 120 120" className="timer-ring">
            <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" strokeWidth="6" />
            <circle cx="60" cy="60" r="52" fill="none" stroke={done ? "var(--green)" : "var(--gold)"} strokeWidth="6"
              strokeDasharray={`${2 * Math.PI * 52}`}
              strokeDashoffset={`${2 * Math.PI * 52 * (1 - pct / 100)}`}
              strokeLinecap="round" style={{ transform: "rotate(-90deg)", transformOrigin: "center", transition: "stroke-dashoffset 0.5s" }} />
          </svg>
          <div className="timer-time">{done ? "✓" : `${mins}:${String(secs).padStart(2, "0")}`}</div>
        </div>
        {stage && stage.action && <div className="timer-action">{stage.action}</div>}
        <div className="timer-btns">
          {!running && !done && <button className="btn p" onClick={start}>{elapsed > 0 ? "Resume" : "Start"}</button>}
          {running && <button className="btn" onClick={() => { clearInterval(intervalRef.current); setRunning(false); }}>Pause</button>}
          <button className="btn" onClick={reset}>Reset</button>
          <button className="btn d sm" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

// ── FIELD / TOGGLE / SELECT ───────────────────────────────────────────────
function Field({ label, value, onChange, multiline, placeholder }) {
  return multiline
    ? <div className="field"><label>{label}</label><textarea value={value} onChange={e => onChange(e.target.value)} rows={2} placeholder={placeholder||""} /></div>
    : <div className="field"><label>{label}</label><input value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder||""} /></div>;
}
function Toggle({ label, value, onChange }) {
  return (
    <div className="field"><label>{label}</label>
      <button className={"toggle-btn" + (value ? " on" : "")} onClick={() => onChange(!value)}>{value ? "Yes" : "No"}</button>
    </div>
  );
}
function Select({ label, value, onChange, options }) {
  return (
    <div className="field"><label>{label}</label>
      <select value={value} onChange={e => onChange(e.target.value)} className="sel-input">
        {options.map(o => <option key={o.value || o} value={o.value || o}>{o.label || o}</option>)}
      </select>
    </div>
  );
}

// ── AI ────────────────────────────────────────────────────────────────────
async function callClaude(system, user, json) {
  const apiKey = window._COFFEE_API_KEY;
  if (!apiKey) return json ? null : "⚠️ No API key set. Tap the ⚙ gear button in the top right to add your Anthropic API key (starts with sk-ant-).";
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: system,
        messages: [{ role: "user", content: user }]
      }),
    });
    if (!res.ok) {
      const errText = await res.text();
      return json ? null : "API error " + res.status + ": " + errText.slice(0, 200);
    }
    const d = await res.json();
    if (d.error) return json ? null : "API error: " + d.error.message;
    const text = d.content?.map(b => b.text || "").join("") || "";
    if (json) { try { return JSON.parse(text.replace(/```json|```/g, "").trim()); } catch { return null; } }
    return text;
  } catch (e) {
    const msg = e.message || String(e);
    if (msg.includes("NetworkError") || msg.includes("Failed to fetch") || msg.includes("Load failed")) {
      return json ? null : "⚠️ Network blocked. Safari home screen apps sometimes block external API calls. Try opening the app in Safari browser instead of from your home screen icon, or check Settings > Safari > Advanced > Experimental Features.";
    }
    return json ? null : "Error: " + msg;
  }
}

  const generate = async () => {
    setLoading(true);
    const prompt = `Generate a coffee info sheet for this bean as JSON only, no markdown:
Bean: ${bean.name} by ${bean.roaster}
Origin: ${bean.origin}
Process: ${bean.process}
Roast: ${bean.roast}
Altitude: ${bean.altitude || "unknown"}
Varietal: ${bean.varietal || "unknown"}
Flavor profile: ${bean.flavorProfile || "unknown"}

Return JSON with these exact keys:
{
  "originStory": "2-3 sentences about the region/country",
  "processExplained": "2-3 sentences explaining the processing method and how it affects flavor",
  "roastProfile": "2 sentences on what this roast level means for this bean",
  "flavorNotes": ["note1", "note2", "note3", "note4"],

      <div className="sec-lbl" style={{ marginBottom: 8 }}>Bean Info Sheet</div>

            Generate a full profile for {bean.name} — origin story, process breakdown, flavor notes, brewing tips.
          </div>
          <button className="btn ai" onClick={generate}>Generate Info Sheet</button>
        </div>
      )}
      {loading && <div className="ai-loading"><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>}
      {info && (
        <div>
          {info.originStory && <div className="info-section"><div className="info-lbl">Origin</div><div className="info-txt">{info.originStory}</div></div>}
          {info.processExplained && <div className="info-section"><div className="info-lbl">Process — {bean.process}</div><div className="info-txt">{info.processExplained}</div></div>}
          {info.roastProfile && <div className="info-section"><div className="info-lbl">Roast Profile</div><div className="info-txt">{info.roastProfile}</div></div>}
          {info.flavorNotes && <div className="info-section"><div className="info-lbl">Flavor Notes</div><div className="flavor-pills">{info.flavorNotes.map((n,i) => <span key={i} className="flavor-pill">{n}</span>)}</div></div>}
          {info.brewingTips && <div className="info-section"><div className="info-lbl">Brewing Tips</div><div className="info-txt">{info.brewingTips}</div></div>}
          {info.pairings && <div className="info-section"><div className="info-lbl">Pairs Well With</div><div className="flavor-pills">{info.pairings.map((p,i) => <span key={i} className="flavor-pill" style={{borderColor:"var(--blue)",color:"var(--blue)"}}>{p}</span>)}</div></div>}
          <button className="btn sm" style={{ marginTop: 12 }} onClick={() => setInfo(null)}>Regenerate</button>
        </div>
      )}
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────
function App() {
  const [beans, setBeans] = useState(loadBeans);
  const [selectedId, setSelectedId] = useState(null);
  const [activeMethod, setActiveMethod] = useState("espresso");
  const [activeTab, setActiveTab] = useState("shot");
  const [editing, setEditing] = useState(false);
  const [adding, setAdding] = useState(false);
  const [showList, setShowList] = useState(true);
  const [beanDraft, setBeanDraft] = useState(null);
  const [addingGrind, setAddingGrind] = useState(false);
  const [grindDraft, setGrindDraft] = useState({ position: { whole: 0, dot: 0 }, note: "", date: "" });
  const [copied, setCopied] = useState(false);
  const [aiLoading, setAiLoading] = useState(false);
  const [aiResult, setAiResult] = useState("");
  const [diagInput, setDiagInput] = useState("");
  const [recipeCtx, setRecipeCtx] = useState("");
  const [showApiModal, setShowApiModal] = useState(false);
  const [apiKeyInput, setApiKeyInput] = useState("");
  const [isMobile, setIsMobile] = useState(false);
  const [showTimer, setShowTimer] = useState(false);
  const [timerStages, setTimerStages] = useState([]);
  const [urlInput, setUrlInput] = useState("");
  const [urlLoading, setUrlLoading] = useState(false);
  const [urlImport, setUrlImport] = useState(null);

  useEffect(() => {
    const check = () => setIsMobile(window.innerWidth < 680);
    check(); window.addEventListener("resize", check);
    return () => window.removeEventListener("resize", check);
  }, []);
  useEffect(() => { saveBeans(beans); }, [beans]);
  useEffect(() => {
    try { const k = localStorage.getItem("coffeeLog_apikey"); if (k) window._COFFEE_API_KEY = k; } catch {}
  }, []);

  const current = beans.find(b => b.id === selectedId);
  const latestGrind = current?.grindLogs?.[activeMethod]?.slice(-1)[0] || null;
  const md = current?.methods?.[activeMethod] || {};

  const upd = fn => setBeans(prev => { const next = fn(prev); saveBeans(next); return next; });

  const selectBean = id => { setSelectedId(id); setShowList(false); setEditing(false); setAdding(false); setActiveTab("shot"); setAiResult(""); setDiagInput(""); setUrlImport(null); };
  const startAdd = () => { setBeanDraft({ roaster: "", name: "", origin: "", process: "", roast: "", altitude: "", varietal: "", flavorProfile: "" }); setAdding(true); setEditing(false); setShowList(false); setUrlImport(null); setUrlInput(""); };
  const saveNew = () => {
    if (!beanDraft.name) return;
    const id = Date.now();
    upd(bs => [...bs, { ...beanDraft, id, methods: { espresso: { ...defaultParams.espresso }, aeropress: { ...defaultParams.aeropress }, pourover: { ...defaultParams.pourover } }, grindLogs: { espresso: [], aeropress: [], pourover: [] } }]);
    setSelectedId(id); setAdding(false); setShowList(false); setActiveTab("shot");
  };
  const deleteBean = id => { upd(bs => bs.filter(b => b.id !== id)); setSelectedId(null); setShowList(true); };
  const startEdit = () => { setBeanDraft({ roaster: current.roaster, name: current.name, origin: current.origin, process: current.process, roast: current.roast, altitude: current.altitude||"", varietal: current.varietal||"", flavorProfile: current.flavorProfile||"", methods: JSON.parse(JSON.stringify(current.methods)) }); setEditing(true); setActiveTab("shot"); };
  const saveEdit = () => { upd(bs => bs.map(b => b.id === selectedId ? { ...b, ...beanDraft } : b)); setEditing(false); };
  const updateDraftMethod = (field, val) => setBeanDraft(d => ({ ...d, methods: { ...d.methods, [activeMethod]: { ...d.methods[activeMethod], [field]: val } } }));

  // Inline param update (live save)
  const updateMethodField = (field, val) => upd(bs => bs.map(b => b.id === selectedId ? { ...b, methods: { ...b.methods, [activeMethod]: { ...b.methods[activeMethod], [field]: val } } } : b));

  const saveGrind = () => {
    const entry = { ...grindDraft, id: Date.now(), date: grindDraft.date || new Date().toLocaleDateString() };
    upd(bs => bs.map(b => b.id === selectedId ? { ...b, grindLogs: { ...b.grindLogs, [activeMethod]: [...(b.grindLogs[activeMethod] || []), entry] } } : b));
    setAddingGrind(false); setGrindDraft({ position: { whole: 0, dot: 0 }, note: "", date: "" });
  };
  const deleteGrind = gid => upd(bs => bs.map(b => b.id === selectedId ? { ...b, grindLogs: { ...b.grindLogs, [activeMethod]: b.grindLogs[activeMethod].filter(g => g.id !== gid) } } : b));

  // URL Import
  const importFromUrl = async () => {
    if (!urlInput.trim()) return;
    setUrlLoading(true); setUrlImport(null);
    const result = await callClaude(
      "You are a coffee data extractor. Given a URL and any context, extract bean info and return ONLY valid JSON with no markdown.",
      `Extract coffee bean information from this URL: ${urlInput}
      
Return JSON with these exact keys (use empty string if unknown):
{
  "roaster": "",
  "name": "",
  "origin": "",
  "process": "",
  "roast": "",
  "altitude": "",
  "varietal": "",
  "flavorProfile": ""
}`,
      true
    );
    if (result) { setUrlImport(result); setBeanDraft(d => ({ ...(d || { methods: { espresso: {...defaultParams.espresso}, aeropress: {...defaultParams.aeropress}, pourover: {...defaultParams.pourover} }, grindLogs: {espresso:[],aeropress:[],pourover:[]} }), ...result })); }
    else { setUrlImport({ error: "Couldn't parse that URL. Fill in manually below." }); }
    setUrlLoading(false);
  };

  // AI Diagnosis
  const runDiagnosis = async () => {
    if (!diagInput.trim()) return;
    setAiLoading(true); setAiResult("");
    const ctx = activeMethod === "espresso"
      ? `Bean: ${current.name} (${current.roaster}), ${current.origin}, ${current.process}, ${current.roast}. Espresso: ${md.dose}g in / ${md.yield}g out / ${md.time}s / ${md.temp}°F. Pre-brew: ${md.preBrew}. Grind: ${grindLabel(latestGrind?.position)}.`
      : activeMethod === "aeropress"
      ? `Bean: ${current.name} (${current.roaster}), ${current.origin}, ${current.process}, ${current.roast}. AeroPress: ${md.dose}g / ${md.water}g / ${md.temp}°F / steep ${md.steepTime}s / press ${md.pressTime}s. Inverted: ${md.inverted}. Bloom: ${md.bloom} ${md.bloomTime}s. Grind: ${grindLabel(latestGrind?.position)}.`
      : `Bean: ${current.name} (${current.roaster}), ${current.origin}, ${current.process}, ${current.roast}. Pour Over V60 metal filter: ${md.dose}g / ${md.water}g / ${md.temp}°F / bloom ${md.bloomAmount}g ${md.bloomTime}s / pours: ${md.pours} / total ${md.totalTime}. Grind: ${grindLabel(latestGrind?.position)}.`;
    const result = await callClaude(SYSTEM, `Setup: ${ctx}\n\nWhat I'm tasting/experiencing: ${diagInput}\n\nSpecific adjustments?`);
    setAiResult(result); setAiLoading(false);
  };

  const generateRecipe = async () => {
    setAiLoading(true); setAiResult("");
    const beanInfo = `${current.name} by ${current.roaster}. Origin: ${current.origin}. Process: ${current.process}. Roast: ${current.roast}.`;
    const inst = activeMethod === "aeropress"
      ? "Generate an AeroPress recipe. Include: dose (g), water (g), temp (°F), inverted or standard, bloom (y/n + time), steep time, press time, grind on 0-12 scale with 5 dots between numbers. Brief rationale."
      : "Generate a pour over recipe for Hario V60 with METAL filter (faster than paper — grind coarser). Include: dose (g), water (g), temp (°F), bloom amount (g)+time, pour sequence with timing and amounts, total time, grind on 0-12 scale. Brief rationale.";
    const result = await callClaude(SYSTEM, `Bean: ${beanInfo}${recipeCtx ? `\nContext: ${recipeCtx}` : ""}\n\n${inst}`);
    setAiResult(result); setAiLoading(false);
  };

  // Timers
  const launchAeropressTimer = () => {
    const stages = [];
    if (md.bloom && md.bloomTime) stages.push({ name: "Bloom", duration: md.bloomTime, action: `Add ${md.dose}g coffee, pour ${Math.round(parseInt(md.dose)*2)}g water, stir gently` });
    if (md.steepTime) stages.push({ name: "Steep", duration: md.steepTime, action: "Wait — let it brew" });
    if (md.pressTime) stages.push({ name: "Press", duration: md.pressTime, action: "Press slowly and steadily" });
    if (stages.length) { setTimerStages(stages); setShowTimer(true); }
  };

  const launchPouroverTimer = () => {
    const stages = [];
    if (md.bloomAmount && md.bloomTime) stages.push({ name: "Bloom", duration: md.bloomTime, action: `Pour ${md.bloomAmount}g, ensure all grounds are saturated` });
    // Parse pours if available
    if (md.pours) {
      const lines = md.pours.split("\n").filter(l => l.trim());
      lines.forEach((l, i) => {
        const match = l.match(/(\d+)\s*s/i);
        const dur = match ? match[1] : "30";
        stages.push({ name: `Pour ${i+1}`, duration: dur, action: l.trim() });
      });
    } else {
      // Default 3 pours
      const waterPerPour = Math.round((parseInt(md.water||300) - parseInt(md.bloomAmount||40)) / 3);
      [1,2,3].forEach(i => stages.push({ name: `Pour ${i}`, duration: "35", action: `Pour ${waterPerPour}g in slow spirals` }));
    }
    if (stages.length) { setTimerStages(stages); setShowTimer(true); }
  };

  const exportText = () => {
    const text = beans.map(b => {
      const secs = METHODS.map(m => {
        const d = b.methods[m]; const gl = b.grindLogs[m];
        const glt = gl?.length ? " | Grind: " + gl.map(g => grindLabel(g.position)).join("→") : "";
        if (m === "espresso") return `  Espresso: ${d.dose}g→${d.yield}g / ${d.time}s / ${d.temp}°F${glt}`;
        if (m === "aeropress") return `  AeroPress: ${d.dose}g / ${d.water}g / ${d.temp}°F / steep ${d.steepTime}s${glt}`;
        return `  Pour Over: ${d.dose}g / ${d.water}g / ${d.temp}°F${glt}`;
      }).join("\n");
      return `${b.roaster} — ${b.name}\n${b.origin} | ${b.process} | ${b.roast}\n${secs}`;
    }).join("\n\n────\n\n");
    navigator.clipboard.writeText(text).catch(() => {});

                <Field label="Roaster" value={beanDraft.roaster} onChange={v => setBeanDraft(d => ({ ...d, roaster: v }))} />
                <Field label="Bean Name" value={beanDraft.name} onChange={v => setBeanDraft(d => ({ ...d, name: v }))} />
                <Field label="Origin" value={beanDraft.origin} onChange={v => setBeanDraft(d => ({ ...d, origin: v }))} />
                <div className="field">
                  <label>Process</label>
                  <select className="sel-input" value={beanDraft.process} onChange={e => setBeanDraft(d => ({ ...d, process: e.target.value }))}>
                    <option value="">Select...</option>
                    {PROCESS_OPTS.map(o => <option key={o} value={o}>{o}</option>)}
                  </select>
                </div>
                <div className="field">
                  <label>Roast Level</label>
                  <select className="sel-input" value={beanDraft.roast} onChange={e => setBeanDraft(d => ({ ...d, roast: e.target.value }))}>
                    <option value="">Select...</option>
                    {ROAST_OPTS.map(o => <option key={o} value={o}>{o}</option>)}
                  </select>
                </div>
                <Field label="Altitude" value={beanDraft.altitude} onChange={v => setBeanDraft(d => ({ ...d, altitude: v }))} placeholder="e.g. 1800m" />
                <div className="field full"><Field label="Varietal" value={beanDraft.varietal} onChange={v => setBeanDraft(d => ({ ...d, varietal: v }))} placeholder="e.g. Bourbon, Gesha" /></div>
                <div className="field full"><Field label="Flavor Profile" value={beanDraft.flavorProfile} onChange={v => setBeanDraft(d => ({ ...d, flavorProfile: v }))} placeholder="e.g. Blueberry, chocolate, floral" /></div>
              </div>
              <div className="fa">
                <button className="btn p" onClick={saveNew}>Save Bean</button>
                <button className="btn" onClick={() => { setAdding(false); setShowList(true); }}>Cancel</button>
              </div>
            </>
          )}

          {!adding && !current && <div className="empty">Select a bean to get started</div>}

          {!adding && current && (
            <>
              <div className="bean-hdr">
                <div className="bean-title">{current.name}</div>
                <div className="bean-roaster">{current.roaster}</div>
                <div className="pills">
                  {current.origin && <span className="pill">{current.origin}</span>}
                  {current.process && <span className="pill">{current.process}</span>}
                  {current.roast && <span className="pill">{current.roast}</span>}
                  {current.altitude && <span className="pill">{current.altitude}</span>}
                </div>
              </div>

              <div className="method-row">
                {METHODS.map(m => (
                  <button key={m} className={"method-btn" + (activeMethod === m ? " active" : "")}
                    onClick={() => { setActiveMethod(m); setActiveTab("shot"); setAiResult(""); setDiagInput(""); }}>
                    {METHOD_LABELS[m]}
                  </button>
                ))}
              </div>

              <div className="tabs">
                {["shot", "grind", ...(activeMethod !== "espresso" ? ["recipe"] : []), "diagnose", "info"].map(t => (
                  <button key={t} className={"tab" + (activeTab === t && !editing ? " active" : "")}
                    onClick={() => { setActiveTab(t); setEditing(false); setAiResult(""); }}>
                    {t === "recipe" ? "AI Recipe" : t === "info" ? "Bean Info" : t.charAt(0).toUpperCase() + t.slice(1)}
                  </button>
                ))}
                <button className={"tab" + (editing ? " active" : "")} onClick={startEdit}>Edit</button>
              </div>

              {/* ── SHOT TAB ── */}
              {activeTab === "shot" && !editing && (
                <>
                  {activeMethod === "espresso" && (
                    <div className="pg">
                      <EditableParam label="Dose" value={md.dose} unit="g" onSave={v => updateMethodField("dose", v)} />
                      <EditableParam label="Yield" value={md.yield} unit="g" onSave={v => updateMethodField("yield", v)} />
                      <EditableParam label="Time" value={md.time} unit="s" onSave={v => updateMethodField("time", v)} />
                      <EditableParam label="Temp" value={md.temp} unit="°F" onSave={v => updateMethodField("temp", v)} />
                      <EditableParam label="Pre-brew" value={md.preBrew} onSave={v => updateMethodField("preBrew", v)} wide small />
                    </div>
                  )}
                  {activeMethod === "aeropress" && (
                    <>
                      <button className="btn timer-btn" onClick={launchAeropressTimer}>▶ Start AeroPress Timer</button>
                      <div className="pg">
                        <EditableParam label="Dose" value={md.dose} unit="g" onSave={v => updateMethodField("dose", v)} />
                        <EditableParam label="Water" value={md.water} unit="g" onSave={v => updateMethodField("water", v)} />
                        <EditableParam label="Temp" value={md.temp} unit="°F" onSave={v => updateMethodField("temp", v)} />
                        <EditableParam label="Steep" value={md.steepTime} unit="s" onSave={v => updateMethodField("steepTime", v)} />
                        <EditableParam label="Press" value={md.pressTime} unit="s" onSave={v => updateMethodField("pressTime", v)} />
                        <div className="pm"><div className="pm-lbl">Inverted</div><div className="pm-val sm">{md.inverted ? "Yes" : "No"}</div></div>
                        <div className="pm w"><div className="pm-lbl">Bloom</div><div className="pm-val sm">{md.bloom ? "Yes — " + md.bloomTime + "s" : "No"}</div></div>
                      </div>
                    </>
                  )}
                  {activeMethod === "pourover" && (
                    <>
                      <button className="btn timer-btn" onClick={launchPouroverTimer}>▶ Start Pour Over Timer</button>
                      <div className="pg">
                        <EditableParam label="Dose" value={md.dose} unit="g" onSave={v => updateMethodField("dose", v)} />
                        <EditableParam label="Water" value={md.water} unit="g" onSave={v => updateMethodField("water", v)} />
                        <EditableParam label="Temp" value={md.temp} unit="°F" onSave={v => updateMethodField("temp", v)} />
                        <EditableParam label="Bloom" value={md.bloomAmount ? md.bloomAmount + "g/" + md.bloomTime + "s" : "—"} onSave={v => updateMethodField("bloomAmount", v)} wide small />
                        <EditableParam label="Total Time" value={md.totalTime} onSave={v => updateMethodField("totalTime", v)} />
                        <div className="pm w"><div className="pm-lbl">Pours</div><div className="pm-val sm" style={{ whiteSpace: "pre-wrap" }}>{md.pours || "—"}</div></div>
                      </div>
                    </>
                  )}
                  <GrindInline />
                  <ShotNotes m={md} />
                  {activeMethod === "espresso" && md.iced && <div className="sec"><div className="sec-lbl">Iced</div><div className="sec-txt blue-txt">{md.iced}</div></div>}
                  <div className="div" />
                  <button className="btn d sm" onClick={() => deleteBean(current.id)}>Delete Bean</button>
                </>
              )}

              {/* ── GRIND TAB ── */}
              {activeTab === "grind" && !editing && (
                <>
                  <div className="sec-lbl" style={{ marginBottom: 10 }}>Grind Log — {METHOD_LABELS[activeMethod]}</div>
                  {!addingGrind && (
                    <button className="btn p sm" style={{ marginBottom: 13 }}
                      onClick={() => { setAddingGrind(true); setGrindDraft({ position: { whole: activeMethod === "espresso" ? 0 : 7, dot: 0 }, note: "", date: "" }); }}>
                      + Log Grind
                    </button>
                  )}
                  {addingGrind && (
                    <div className="ga-form">
                      <div className="sec-lbl" style={{ marginBottom: 8 }}>Position ({activeMethod === "espresso" ? "0–1 calibrated" : "0–12 full range"})</div>
                      <GrindSelector value={grindDraft.position} onChange={p => setGrindDraft(g => ({ ...g, position: p }))} />
                      <div style={{ marginTop: 12, display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                        <Field label="Date" value={grindDraft.date} onChange={v => setGrindDraft(g => ({ ...g, date: v }))} />
                        <div style={{ gridColumn: "1/-1" }}><Field label="Notes" value={grindDraft.note} onChange={v => setGrindDraft(g => ({ ...g, note: v }))} multiline /></div>
                      </div>
                      <div className="fa" style={{ marginTop: 10 }}>
                        <button className="btn p sm" onClick={saveGrind}>Save</button>
                        <button className="btn sm" onClick={() => setAddingGrind(false)}>Cancel</button>
                      </div>
                    </div>
                  )}
                  {!current.grindLogs?.[activeMethod]?.length && !addingGrind && <div className="empty-grind">No grind entries for {METHOD_LABELS[activeMethod]} yet</div>}
                  <div className="gl">
                    {[...(current.grindLogs?.[activeMethod] || [])].reverse().map((g, i) => (
                      <div key={g.id} className="ge">
                        <div>
                          <div className="ge-pos">{grindLabel(g.position)}</div>
                          <div className="ge-date">{g.date}</div>
                          {i === 0 && <div className="ge-badge">Current</div>}
                          {g.note && <div className="ge-note">{g.note}</div>}
                        </div>
                        <button className="btn d sm" onClick={() => deleteGrind(g.id)}>✕</button>
                      </div>
                    ))}
                  </div>
                </>
              )}

              {/* ── AI RECIPE TAB ── */}
              {activeTab === "recipe" && !editing && activeMethod !== "espresso" && (
                <>
                  <div className="sec-lbl" style={{ marginBottom: 6 }}>AI Recipe — {METHOD_LABELS[activeMethod]}</div>
                  <div className="sec-txt" style={{ marginBottom: 12, fontSize: 12 }}>Starting recipe for {current.name} ({current.roast}, {current.process}).</div>
                  <textarea className="ai-ta" rows={3} placeholder="Optional: 'bright and fruity' or 'lower acidity, more body'..." value={recipeCtx} onChange={e => setRecipeCtx(e.target.value)} />
                  <div className="fa" style={{ marginBottom: 14 }}>
                    <button className="btn ai" disabled={aiLoading} onClick={generateRecipe}>{aiLoading ? "Generating..." : "Generate Recipe"}</button>
                    {aiResult && <button className="btn sm" onClick={() => setAiResult("")}>Clear</button>}
                  </div>
                  <AiSection />
                </>
              )}

              {/* ── DIAGNOSE TAB ── */}
              {activeTab === "diagnose" && !editing && (
                <>
                  <div className="sec-lbl" style={{ marginBottom: 6 }}>Diagnose — {METHOD_LABELS[activeMethod]}</div>
                  <div className="sec-txt" style={{ marginBottom: 12, fontSize: 12 }}>Describe what you're tasting and get specific adjustments.</div>
                  <textarea className="ai-ta" rows={4}
                    placeholder={activeMethod === "espresso" ? "e.g. 'Too sour, 22s, lacking sweetness...'" : activeMethod === "aeropress" ? "e.g. 'Muddy, over-extracted, too heavy...'" : "e.g. 'Flat, no clarity, fast drain...'"}
                    value={diagInput} onChange={e => setDiagInput(e.target.value)} />
                  <div className="fa" style={{ marginBottom: 14 }}>
                    <button className="btn ai" disabled={aiLoading || !diagInput.trim()} onClick={runDiagnosis}>{aiLoading ? "Diagnosing..." : "Diagnose"}</button>
                    {aiResult && <button className="btn sm" onClick={() => { setAiResult(""); setDiagInput(""); }}>Clear</button>}
                  </div>
                  <AiSection />
                </>
              )}

              {/* ── BEAN INFO TAB ── */}
              {activeTab === "info" && !editing && (
                <>
                  <div className="fg" style={{ marginBottom: 14 }}>
                    {current.altitude && <div className="pm"><div className="pm-lbl">Altitude</div><div className="pm-val sm">{current.altitude}</div></div>}
                    {current.varietal && <div className="pm"><div className="pm-lbl">Varietal</div><div className="pm-val sm">{current.varietal}</div></div>}
                    {current.flavorProfile && <div className="pm w"><div className="pm-lbl">Flavor Profile</div><div className="pm-val sm">{current.flavorProfile}</div></div>}
                  </div>
                  <div className="div" />
                  <BeanInfoSheet bean={current} />
                </>
              )}

              {/* ── EDIT TAB ── */}
              {editing && beanDraft && (() => {
                const m = beanDraft.methods?.[activeMethod] || defaultParams[activeMethod];
                const u = f => v => updateDraftMethod(f, v);
                return (
                  <>
                    <div className="sec-lbl" style={{ marginBottom: 10 }}>Bean Info</div>
                    <div className="fg" style={{ marginBottom: 14 }}>
                      <Field label="Roaster" value={beanDraft.roaster} onChange={v => setBeanDraft(d => ({ ...d, roaster: v }))} />
                      <Field label="Bean Name" value={beanDraft.name} onChange={v => setBeanDraft(d => ({ ...d, name: v }))} />
                      <Field label="Origin" value={beanDraft.origin} onChange={v => setBeanDraft(d => ({ ...d, origin: v }))} />
                      <div className="field">
                        <label>Process</label>
                        <select className="sel-input" value={beanDraft.process} onChange={e => setBeanDraft(d => ({ ...d, process: e.target.value }))}>
                          {PROCESS_OPTS.map(o => <option key={o} value={o}>{o}</option>)}
                        </select>
                      </div>
                      <div className="field">
                        <label>Roast Level</label>
                        <select className="sel-input" value={beanDraft.roast} onChange={e => setBeanDraft(d => ({ ...d, roast: e.target.value }))}>
                          {ROAST_OPTS.map(o => <option key={o} value={o}>{o}</option>)}
                        </select>
                      </div>
                      <Field label="Altitude" value={beanDraft.altitude||""} onChange={v => setBeanDraft(d => ({ ...d, altitude: v }))} />
                      <div className="field full"><Field label="Varietal" value={beanDraft.varietal||""} onChange={v => setBeanDraft(d => ({ ...d, varietal: v }))} /></div>
                      <div className="field full"><Field label="Flavor Profile" value={beanDraft.flavorProfile||""} onChange={v => setBeanDraft(d => ({ ...d, flavorProfile: v }))} /></div>
                    </div>
                    <div className="sec-lbl" style={{ marginBottom: 10 }}>{METHOD_LABELS[activeMethod]} Parameters</div>
                    {activeMethod === "espresso" && (
                      <div className="fg">
                        <Select label="Dose" value={m.dose} onChange={u("dose")} options={DOSES_ESP} />
                        <Select label="Yield" value={m.yield} onChange={u("yield")} options={YIELD_OPTS} />
                        <Select label="Time" value={m.time} onChange={u("time")} options={TIME_OPTS} />
                        <Select label="Temp" value={m.temp} onChange={u("temp")} options={TEMPS} />
                        <div className="field full"><Field label="Pre-brew" value={m.preBrew} onChange={u("preBrew")} /></div>
                        <div className="field full"><Field label="Tasting Notes" value={m.notes} onChange={u("notes")} multiline /></div>
                        <div className="field full"><Field label="What Worked" value={m.whatWorked} onChange={u("whatWorked")} multiline /></div>
                        <div className="field full"><Field label="What Didn't" value={m.whatDidnt} onChange={u("whatDidnt")} multiline /></div>
                        <div className="field full"><Field label="Iced Notes" value={m.iced} onChange={u("iced")} multiline /></div>
                      </div>
                    )}
                    {activeMethod === "aeropress" && (
                      <div className="fg">
                        <Select label="Dose" value={m.dose} onChange={u("dose")} options={DOSES_MAN} />
                        <Select label="Water" value={m.water} onChange={u("water")} options={WATER_OPTS} />
                        <Select label="Temp" value={m.temp} onChange={u("temp")} options={TEMPS} />
                        <Select label="Steep Time" value={m.steepTime} onChange={u("steepTime")} options={STEEP_OPTS} />
                        <Select label="Press Time" value={m.pressTime} onChange={u("pressTime")} options={["20","25","30","35","40","45","60"].map(v => ({ value: v, label: v + "s" }))} />
                        <Toggle label="Inverted?" value={m.inverted} onChange={u("inverted")} />
                        <Toggle label="Bloom?" value={m.bloom} onChange={u("bloom")} />
                        {m.bloom && <Select label="Bloom Time" value={m.bloomTime} onChange={u("bloomTime")} options={BLOOM_TIME_OPTS} />}
                        <div className="field full"><Field label="Tasting Notes" value={m.notes} onChange={u("notes")} multiline /></div>
                        <div className="field full"><Field label="What Worked" value={m.whatWorked} onChange={u("whatWorked")} multiline /></div>
                        <div className="field full"><Field label="What Didn't" value={m.whatDidnt} onChange={u("whatDidnt")} multiline /></div>
                      </div>
                    )}
                    {activeMethod === "pourover" && (
                      <div className="fg">
                        <Select label="Dose" value={m.dose} onChange={u("dose")} options={DOSES_MAN} />
                        <Select label="Water" value={m.water} onChange={u("water")} options={WATER_OPTS} />
                        <Select label="Temp" value={m.temp} onChange={u("temp")} options={TEMPS} />
                        <Select label="Bloom Amount" value={m.bloomAmount} onChange={u("bloomAmount")} options={["20","30","40","50","60"].map(v => ({ value: v, label: v + "g" }))} />
                        <Select label="Bloom Time" value={m.bloomTime} onChange={u("bloomTime")} options={BLOOM_TIME_OPTS} />
                        <Field label="Total Time" value={m.totalTime} onChange={u("totalTime")} placeholder="e.g. 3:30" />
                        <div className="field full"><Field label="Pour Sequence (one per line with timing)" value={m.pours} onChange={u("pours")} multiline /></div>
                        <div className="field full"><Field label="Tasting Notes" value={m.notes} onChange={u("notes")} multiline /></div>
                        <div className="field full"><Field label="What Worked" value={m.whatWorked} onChange={u("whatWorked")} multiline /></div>
                        <div className="field full"><Field label="What Didn't" value={m.whatDidnt} onChange={u("whatDidnt")} multiline /></div>
                      </div>
                    )}
                    <div className="fa">
                      <button className="btn p" onClick={saveEdit}>Save</button>
                      <button className="btn" onClick={() => setEditing(false)}>Cancel</button>
                    </div>
                  </>
                );
              })()}
            </>
          )}
        </div>
      </div>

      {/* TIMER */}
      {showTimer && <Timer stages={timerStages} onClose={() => setShowTimer(false)} />}

      {/* API KEY MODAL */}
      {showApiModal && (
        <div className="modal-overlay" onClick={() => setShowApiModal(false)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <h2>API Key</h2>
            <p>Required for AI features. Stored locally on this device only. Never shared.</p>
            <p style={{marginBottom:8}}>Get your key at <strong>console.anthropic.com</strong> → API Keys → Create Key</p>
            {window._COFFEE_API_KEY
              ? <p style={{color:"var(--green)",marginBottom:8,fontSize:11}}>✓ Key saved: {window._COFFEE_API_KEY.slice(0,12)}...</p>
              : <p style={{color:"var(--red)",marginBottom:8,fontSize:11}}>✗ No key saved yet</p>
            }
            <input type="text" placeholder="sk-ant-api03-..." value={apiKeyInput} onChange={e => setApiKeyInput(e.target.value)} onKeyDown={e => e.key === "Enter" && saveApiKey()} />
            <div className="fa" style={{marginBottom:12}}>
              <button className="btn p" onClick={saveApiKey}>Save Key</button>
              <button className="btn" onClick={() => setShowApiModal(false)}>Cancel</button>
            </div>
            <div style={{borderTop:"1px solid var(--border)",paddingTop:12}}>
              <p style={{marginBottom:8,fontSize:10,color:"var(--muted)"}}>Test your key:</p>
              <button className="btn ai" style={{width:"100%"}} onClick={async () => {
                window._COFFEE_API_KEY = apiKeyInput.trim() || window._COFFEE_API_KEY;
                const r = await callClaude("You are a helpful assistant.", "Say only: API key working!");
                alert(r);
              }}>Test Connection</button>
            </div>
          </div>
        </div>
      )}

      <div className={"toast" + (copied ? " show" : "")}>Copied!</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

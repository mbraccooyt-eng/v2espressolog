const {useState,useEffect,useRef} = React;

// ── CONSTANTS ──────────────────────────────────────────────────────────────
const DOTS=5,GRIND_MAX=12;
const METHODS=["espresso","aeropress","pourover","moccamaster"];
const METHOD_LABELS={espresso:"Espresso",aeropress:"AeroPress",pourover:"Pour Over",moccamaster:"Moccamaster"};
const STORAGE_KEY="coffeeLog_v6";
const LEGACY_KEYS=["coffeeLog_v5","coffeeLog_v4","coffeeLog_v3","coffeeLog_beans_v3"];

const DEF={

const WATER_MOCCA=Array.from({length:16},(_,i)=>String(500+i*50)).map(v=>({value:v,label:v+"ml"}));
const ratioStr=(dose,water)=>{const d=parseFloat(dose),w=parseFloat(water);return d>0&&w>0?"1:"+(w/d).toFixed(1):"—";};
const BLOOM_T=["20","25","30","35","40","45","50","60"].map(v=>({value:v,label:v+"s"}));

// ── STORAGE ────────────────────────────────────────────────────────────────
function migrate(b){
  return{roastDate:"",imageUrl:"",imageBase64:"",imageOffsetX:50,imageOffsetY:50,imageZoom:100,rating:0,altitude:"",varietal:"",flavorProfile:"",inStock:true,currentlyBrewing:false,frozen:false,frozenOn:"",thawedOn:"",price:"",bagGrams:"",remainingG:"",savedRecipes:{aeropress:[],pourover:[],moccamaster:[]},...b,
    methods:{espresso:{...DEF.espresso,...(b.methods?.espresso||{})},aeropress:{...DEF.aeropress,...(b.methods?.aeropress||{})},pourover:{...DEF.pourover,...(b.methods?.pourover||{})},moccamaster:{...DEF.moccamaster,...(b.methods?.moccamaster||{})}},
    grindLogs:{espresso:b.grindLogs?.espresso||[],aeropress:b.grindLogs?.aeropress||[],pourover:b.grindLogs?.pourover||[],moccamaster:b.grindLogs?.moccamaster||[]},
    savedRecipes:{aeropress:[],pourover:[],moccamaster:[],...(b.savedRecipes||{})},
    shots:{espresso:[],aeropress:[],pourover:[],moccamaster:[],...(b.shots||{})},
    dialed:{espresso:null,aeropress:null,pourover:null,moccamaster:null,...(b.dialed||{})}};
}
// If stored data exists but can't be read, we must NOT let the app overwrite it with an empty list.
let LOAD_FAILED=false;
const BACKUP_KEY="coffeeLog_autobackup_v1";
function loadBeans(){
  try{
    const r=localStorage.getItem(STORAGE_KEY);
    if(r){
      try{return JSON.parse(r).map(migrate);}
      catch(e){LOAD_FAILED=true;try{localStorage.setItem("coffeeLog_unreadable_copy",r);}catch(e2){}return[];}
    }
    for(const k of LEGACY_KEYS){const v=localStorage.getItem(k);if(v){const b=JSON.parse(v).map(migrate);localStorage.setItem(STORAGE_KEY,JSON.stringify(b));return b;}}
  }catch(e){}
  return[];
}
function loadAutoBackup(){try{const r=localStorage.getItem(BACKUP_KEY);if(!r)return null;const d=JSON.parse(r);return d&&Array.isArray(d.beans)&&d.beans.length?d:null;}catch(e){return null;}}
function saveBeans(b){
  if(LOAD_FAILED)return;
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(b));}catch(e){}
  // Rolling safety copy (photos stripped to stay small). A sudden drop of more than half the beans
  // is treated as suspicious and does not replace the existing backup.
  try{
    const prev=loadAutoBackup();
    if(b.length>0&&(!prev||b.length>=prev.beans.length*0.5)){
      localStorage.setItem(BACKUP_KEY,JSON.stringify({savedAt:new Date().toISOString(),beans:b.map(({imageBase64,...rest})=>rest)}));
    }
  }catch(e){}
}

const LASTBACKUP_KEY="coffeeLog_lastbackup_v1";
function loadLastBackup(){try{return parseInt(localStorage.getItem(LASTBACKUP_KEY)||"0",10)||0;}catch(e){return 0;}}
function markBackupDone(){const t=Date.now();try{localStorage.setItem(LASTBACKUP_KEY,String(t));}catch(e){}return t;}
// Saves text as a file through the iPhone share sheet (Save to Files / iCloud Drive / AirDrop), or a normal
// download elsewhere. This is the only backup that survives the browser clearing the app's saved data.
async function saveBackupFile(text,filename){
  try{
    const file=new File([text],filename,{type:"text/plain"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:filename});
      return "shared";
    }
  }catch(e){if(e&&e.name==="AbortError")return "cancelled";}
  try{
    const url=URL.createObjectURL(new Blob([text],{type:"text/plain"}));
    const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    return "downloaded";
  }catch(e){return "failed";}
}
function loadAwayLog(){try{const r=localStorage.getItem(AWAYLOG_KEY);return r?JSON.parse(r):[];}catch(e){return[];}}
function saveAwayLog(a){try{localStorage.setItem(AWAYLOG_KEY,JSON.stringify(a));}catch(e){}}
const MATCH_KEY="coffeeLog_matches_v1";
function loadMatchHistory(){try{const r=localStorage.getItem(MATCH_KEY);return r?JSON.parse(r):[];}catch(e){return[];}}
function saveMatchHistory(a){try{localStorage.setItem(MATCH_KEY,JSON.stringify(a));}catch(e){}}

// ── HELPERS ────────────────────────────────────────────────────────────────
function grindLabel(pos){if(!pos)return"—";if(pos.dot===0)return String(pos.whole);return pos.whole+"·".repeat(pos.dot);}
function daysAgo(s){if(!s)return null;const d=new Date(s);if(isNaN(d))return null;const n=Math.floor((Date.now()-d.getTime())/86400000);return n===0?"Today":n===1?"1 day ago":n+" days ago";}
function daysAgoNum(s){if(!s)return null;const d=new Date(s);if(isNaN(d))return null;return Math.floor((Date.now()-d.getTime())/86400000);}
function fmtDate(s){if(!s)return"";const d=new Date(s+(s.length<=10?"T00:00:00":""));if(isNaN(d))return s;const mm=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0"),yy=String(d.getFullYear()).slice(-2);return`${mm}/${dd}/${yy}`;}
// ── Freezer-aware age ──
// Age stops counting while beans are frozen. effective age = days from roast to freezing, plus days since the
// beans were taken out. A bean marked Frozen with no dates (older entries) still just shows "Frozen".
function parseD(s){if(!s)return null;const m=String(s).match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));const d=new Date(s);return isNaN(d)?null:d;}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function dayDiff(a,b){const x=parseD(a),y=parseD(b);if(!x||!y)return null;return Math.round((y-x)/86400000);}
function isFrozen(b){return b.frozenOn?!b.thawedOn:!!b.frozen;}
function effectiveAge(b){
  if(!b.roastDate)return null;
  if(b.frozenOn){
    const atFreeze=dayDiff(b.roastDate,b.frozenOn);
    if(atFreeze!==null){
      const base=Math.max(0,atFreeze);
      if(!b.thawedOn)return base;
      const since=dayDiff(b.thawedOn,todayISO());
      if(since!==null)return base+Math.max(0,since);
    }
  }
  return dayDiff(b.roastDate,todayISO());
}
function ageLabel(b){
  const n=effectiveAge(b);
  if(n===null)return null;
  if(b.frozenOn)return isFrozen(b)?"Frozen at "+n+(n===1?" day":" days"):n+(n===1?" day":" days")+" of age";
  return n===0?"Today":n===1?"1 day ago":n+" days ago";
}
function freshness(b){if(isFrozen(b))return{label:"Frozen",color:"var(--blue)"};const n=effectiveAge(b);if(n===null)return null;if(n<5)return{label:"Too Fresh",color:"var(--blue)"};if(n<=30)return{label:"Peak",color:"var(--green)"};if(n<=45)return{label:"Aging",color:"var(--gold)"};return{label:"Past Peak",color:"var(--red)"};}
function cleanMd(t){
  if(!t)return"";
  // Convert any stray markdown table into "Row — col: value" lines so it never renders as raw pipe/dash text.
  t=t.replace(/(^\|.*\|[ \t]*\n)(^\|[ \t:|-]+\|[ \t]*\n)((?:^\|.*\|[ \t]*\n?)*)/gm,(m,headerLine,sepLine,bodyLines)=>{
    const splitRow=l=>l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
    const headers=splitRow(headerLine);
    const rows=bodyLines.split("\n").filter(l=>l.trim().startsWith("|"));
    return rows.map(row=>{
      const cells=splitRow(row);
      const label=cells[0];
      const rest=cells.slice(1).map((c,i)=>headers[i+1]?`${headers[i+1]}: ${c}`:c).filter(x=>x).join(", ");
      return rest?`${label} — ${rest}`:label;
    }).join("\n");
  });
  return t.replace(/^#{1,6}\s+/gm,"").replace(/\*\*(.+?)\*\*/g,"$1").replace(/\*(.+?)\*/g,"$1").replace(/^-{3,}\s*$/gm,"").replace(/^[-*]\s+/gm,"• ").trim();
}
// Converts ALL CAPS or all-lowercase bag text into normal Title Case, but leaves already-mixed-case
// text alone (so a name someone typed deliberately, like "iPhone"-style branding, isn't mangled).
const TITLECASE_SMALL_WORDS=new Set(["a","an","and","as","at","but","by","de","del","el","for","in","la","le","of","on","or","the","to","van","von"]);
function titleCase(s){
  if(!s)return s;
  const isShouty=s===s.toUpperCase()&&/[A-Z]/.test(s);
  const isFlat=s===s.toLowerCase()&&/[a-z]/.test(s);
  if(!isShouty&&!isFlat)return s; // already has intentional mixed case — leave it
  const words=s.toLowerCase().split(" ");
  return words.map((w,i)=>{
    if(!w)return w;
    if(i>0&&TITLECASE_SMALL_WORDS.has(w))return w;
    // Keep short all-caps tokens that look like acronyms/codes intact (e.g. "X64", "V60")
    if(/^[a-z]*\d/.test(w)||/^\d/.test(w))return w.toUpperCase();
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(" ");
}

// ── ROASTER NAMES (one canonical spelling per roaster) ─────────────────────
const ROASTER_FILLER=new Set(["coffee","coffees","roasters","roaster","roasting","roastery","roastworks","co","company","cafe","the","and","inc","llc"]);
function rKey(s){
  if(!s)return"";
  const raw=String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9 ]+/g," ");
  const parts=raw.split(/\s+/).filter(w=>w&&!ROASTER_FILLER.has(w));
  return parts.length?parts.join(""):raw.replace(/\s+/g,"");
}
function lev(a,b){
  if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur;
  }
  return prev[b.length];
}
const isShouty=s=>s===s.toUpperCase()&&/[A-Z]/.test(s);
const isFlat=s=>s===s.toLowerCase()&&/[a-z]/.test(s);
function roasterGroups(names){
  const m={};
  (names||[]).forEach(n=>{
    const raw=(n||"").trim();if(!raw)return;
    const k=rKey(raw);if(!k)return;
    const g=m[k]||(m[k]={key:k,variants:{},n:0});
    g.variants[raw]=(g.variants[raw]||0)+1;g.n++;
  });
  return Object.values(m).map(g=>{
    const vs=Object.entries(g.variants).sort((a,b)=>{
      const pa=(isShouty(a[0])||isFlat(a[0]))?0:1,pb=(isShouty(b[0])||isFlat(b[0]))?0:1;
      return b[1]-a[1]||pb-pa||b[0].length-a[0].length;
    });
    return{key:g.key,name:titleCase(vs[0][0]),variants:vs.map(v=>v[0]),n:g.n,mixed:vs.length>1};
  }).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
}
// Returns the canonical spelling if this roaster already exists, otherwise a tidy Title Case version.
function snapRoaster(name,groups){
  const raw=(name||"").trim();if(!raw)return raw;
  const k=rKey(raw);
  const g=(groups||[]).find(x=>x.key===k);
  return g?g.name:titleCase(raw);
}
// A close-but-not-identical existing roaster (probable typo), or null.
function similarRoaster(name,groups){
  const k=rKey(name);if(k.length<4)return null;
  let best=null,bd=99;
  (groups||[]).forEach(g=>{if(g.key===k)return;const d=lev(k,g.key);const lim=k.length>=9?2:1;if(d<=lim&&d<bd){bd=d;best=g;}});
  return best;
}
// Per-roaster ratings. Small samples are pulled toward your overall average so one 9.5 does not beat five 9.0s.
function roasterStats(beans,awayLog){
  const items=[
    ...beans.map(b=>({roaster:b.roaster,name:b.name,rating:b.rating||0,inStock:b.inStock!==false,source:"Your Beans",origin:b.origin,process:b.process,roast:b.roast})),
    ...awayLog.map(a=>({roaster:a.roaster,name:a.name,rating:a.rating||0,inStock:false,source:"Tasting Log",origin:a.origin,process:a.process,roast:a.roast})),
  ].filter(i=>rKey(i.roaster));
  const groups=roasterGroups(items.map(i=>i.roaster));
  const allRated=items.filter(i=>i.rating>0);
  const prior=allRated.length?allRated.reduce((s,i)=>s+i.rating,0)/allRated.length:7;
  const M=2;
  return groups.map(g=>{
    const its=items.filter(i=>rKey(i.roaster)===g.key);
    const rated=its.filter(i=>i.rating>0);
    const sum=rated.reduce((s,i)=>s+i.rating,0);
    const sorted=[...rated].sort((a,b)=>b.rating-a.rating);
    return{k:g.name,key:g.key,variants:g.variants,mixed:g.mixed,n:its.length,rated:rated.length,
      avg:rated.length?sum/rated.length:0,adj:(sum+prior*M)/(rated.length+M),
      best:sorted[0]||null,worst:sorted.length>1?sorted[sorted.length-1]:null,
      inStock:its.filter(i=>i.inStock).length,limited:rated.length<3,items:its};
  }).sort((a,b)=>b.adj-a.adj||b.n-a.n);
}

// ── COST & STOCK ───────────────────────────────────────────────────────────
function num(v){const n=parseFloat(v);return isNaN(n)?null:n;}
function money(n){return n===null||n===undefined||isNaN(n)?"—":"$"+(n>=100?n.toFixed(0):n.toFixed(2));}
function costInfo(b,dose){
  const p=num(b.price),g=num(b.bagGrams);
  if(!p||!g)return null;
  const perG=p/g,d=num(dose);
  return{perG,per250:perG*250,perKg:perG*1000,perDose:d?perG*d:null};
}
function stockInfo(b,dose){
  const g=num(b.bagGrams),r=num(b.remainingG);
  if(g===null&&r===null)return null;
  const rem=r!==null?r:g;
  const pct=g?Math.max(0,Math.min(100,rem/g*100)):null;
  const d=num(dose)||18;
  const empty=rem<=0,low=!empty&&(rem<d*2||(pct!==null&&pct<=15));
  return{rem,total:g,pct,empty,low,doses:Math.floor(rem/d)};
}

// ── GRIND MATH (X64: whole numbers with 5 dots between, higher = coarser) ──
function grindIdx(p){return p?p.whole*(DOTS+1)+p.dot:null;}
function idxToPos(i){const n=Math.max(0,Math.min(GRIND_MAX*(DOTS+1),i));const w=Math.floor(n/(DOTS+1));return{whole:w,dot:w===GRIND_MAX?0:n-w*(DOTS+1)};}
function shiftGrind(p,steps){const i=grindIdx(p);return i===null?null:idxToPos(i+steps);}

// ── COMPASS ENGINE: tastes → position → ONE next move ──────────────────────
const TASTE_CHIPS=[
  {id:"sour",label:"Sour",dx:-22,dy:0},
  {id:"salty",label:"Salty",dx:-14,dy:6},
  {id:"bitter",label:"Bitter",dx:22,dy:0},
  {id:"drying",label:"Drying",dx:16,dy:6},
  {id:"harsh",label:"Harsh",dx:10,dy:-14},
  {id:"muddy",label:"Muddy",dx:8,dy:-10},
  {id:"thin",label:"Thin",dx:0,dy:24},
  {id:"hollow",label:"Hollow",dx:4,dy:16},
  {id:"flat",label:"Flat",dx:-6,dy:18},
  {id:"heavy",label:"Heavy",dx:6,dy:-18},
  {id:"sweet",label:"Sweet",good:true},
  {id:"balanced",label:"Balanced",good:true},
  {id:"juicy",label:"Juicy",good:true},
];
function sweetZone(zones){return zones.find(z=>z.id==="sweet_spot")||zones[0];}
function nearestZone(zones,x,y){let best=null,bd=1e9;zones.forEach(z=>{const d=Math.hypot(z.x-x,z.y-y);if(d<bd){bd=d;best=z;}});return best;}
// Chips alone can place the shot on the map, so the compass tap becomes optional.
function inferZone(zones,tastes){
  const sw=sweetZone(zones);
  const picked=TASTE_CHIPS.filter(c=>tastes.includes(c.id));
  if(!picked.length)return null;
  const neg=picked.filter(c=>!c.good),good=picked.filter(c=>c.good);
  if(!neg.length)return sw;
  const k=good.length?0.5:1;
  const x=sw.x+neg.reduce((s,c)=>s+c.dx,0)*k,y=sw.y+neg.reduce((s,c)=>s+c.dy,0)*k;
  return nearestZone(zones,x,y);
}
const MANUAL_TECHNIQUE_ZONES=["channeled_harsh","channeled_uneven","astringent","astringent_dry","flat","flat_dull","over_diluted","harsh_muddy"];
const CLOSE_ZONES=["balanced","nuanced","rich_full","bright_clean","rich","clean_light"];
function fmtSteps(s){return s===0?"hold the grind":(s<0?"finer":"coarser")+" "+Math.abs(s)+(Math.abs(s)===1?" dot":" dots");}
function nextMove(c){
  const{method,zone,tastes,time,shots,bean,zones}=c;
  const has=id=>tastes.includes(id);
  const sw=sweetZone(zones);
  const sourish=has("sour")||has("salty"),bitterish=has("bitter")||has("drying")||has("harsh");
  const dist=Math.hypot(zone.x-sw.x,zone.y-sw.y);
  const side=sourish&&!bitterish?"under":bitterish&&!sourish?"over":zone.x<45?"under":zone.x>62?"over":"center";
  const out={title:"",move:"",why:"",steps:0,flags:[],lockable:false,doseNote:""};
  const sweet=zone.id==="sweet_spot";
  const bigStep=method==="espresso"?(dist>28?3:2):(dist>26?5:2);
  const t=time&&time>0?time:null;
  if(sweet){out.title="Dialed in";out.move="Keep everything exactly the same.";out.why="Sweet, balanced and rich is the target. Lock these settings in so you do not drift.";out.lockable=true;}
  else if(CLOSE_ZONES.includes(zone.id)&&side==="center"){
    out.title="Very close";out.lockable=true;
    out.move="Leave it, or make one tiny change: "+fmtSteps(zone.x<sw.x?-1:1)+". If you like the cup, lock it in.";
    out.steps=0;out.why=zone.fix;
  }
  else if(method==="espresso"){
    if(t&&t>35&&(side==="under"||sourish)){out.title="Slow and sour: channeling";out.move="Do not go finer. Fix puck prep first: even distribution, level tamp, screen fully seated. If the portafilter will not lock in with the screen, drop the dose 0.5 to 1g.";out.why="A shot over 35 seconds that tastes sour is usually uneven extraction, not a grind that is too coarse.";}
    else if(t&&t<22&&bitterish){out.title="Fast but bitter: channeling";out.move="Fix distribution first. If the puck is clean and it still runs fast, go finer 1 dot.";out.steps=0;out.why="Bitter plus fast means water is finding a shortcut.";}
    else if(t&&t<22){out.title="Running fast";out.steps=-bigStep;out.move="Go "+fmtSteps(-bigStep)+". Do not go coarser.";out.why="Under 22 seconds is under-extracted almost every time.";}
    else if(side==="under"){out.title="Under-extracted";out.steps=-bigStep;out.move="Go "+fmtSteps(-bigStep)+", or lengthen the yield by 2 to 4g.";out.why=zone.fix;}
    else if(side==="over"){out.title="Over-extracted";out.steps=t&&t<22?0:bigStep;out.move=t&&t<22?"Fix puck prep, do not go coarser.":"Go "+fmtSteps(bigStep)+", or shorten the yield by 2 to 4g.";out.why=zone.fix;}
    else if(zone.y>58||has("thin")||has("hollow")){out.title="Weak and thin";out.move="Raise the dose 0.5g or shorten the yield by 2 to 4g. Keep the grind where it is.";out.why=zone.fix;}
    else{out.title=zone.label;out.move=zone.fix;out.why=zone.desc;}
  }
  else{
    if(MANUAL_TECHNIQUE_ZONES.includes(zone.id)){out.title=zone.label;out.move=zone.fix;out.why="This is a technique problem more than a grind problem, so keep the grind where it is.";}
    else if(zone.id==="stalled_bitter"){out.title="Choking the bed";out.steps=5;out.move="Go "+fmtSteps(5)+".";out.why=zone.fix;}
    else if(side==="under"){out.title="Under-extracted";out.steps=-bigStep;out.move="Go "+fmtSteps(-bigStep)+".";out.why=zone.fix;}
    else if(side==="over"){out.title="Over-extracted";out.steps=bigStep;out.move="Go "+fmtSteps(bigStep)+".";out.why=zone.fix;}
    else{out.title=zone.label;out.move=zone.fix;out.why=zone.desc;}
  }
  // Flags: what is muddying this dial-in
  const hist=(shots||[]).slice(-4);
  const idxs=hist.map(s=>grindIdx(s.grind)).filter(v=>v!==null);
  let flips=0;for(let i=2;i<idxs.length;i++){const a=idxs[i-1]-idxs[i-2],b=idxs[i]-idxs[i-1];if(a&&b&&Math.sign(a)!==Math.sign(b))flips++;}
  if(flips>=1)out.flags.push("The grind has been going back and forth. Change one thing at a time, then pull two shots before judging.");
  const doses=[...new Set(hist.slice(-3).map(s=>String(s.dose||"")).filter(Boolean))];
  if(doses.length>1)out.flags.push("The dose changed between shots, which hides what the grind is doing. Pick one dose and hold it.");
  if(bean&&bean.thawedOn){const d=dayDiff(bean.thawedOn,todayISO());if(d!==null&&d>=0&&d<=5)out.flags.push("Thawed "+(d===0?"today":d+(d===1?" day":" days")+" ago")+". Freshly thawed beans run uneven for a few days, so hold your settings steady.");}
  else if(bean){const a=effectiveAge(bean);if(a!==null&&a<5&&!isFrozen(bean))out.flags.push("Very fresh beans (day "+a+") are erratic. Give them a few more days before chasing the grind.");}
  // Trend vs last shot
  const prev=hist[hist.length-1];
  if(prev&&prev.zone){const pz=zones.find(z=>z.id===prev.zone);if(pz){const pd=Math.hypot(pz.x-sw.x,pz.y-sw.y);const diff=pd-dist;
    if(diff>4)out.trend={good:true,text:"Closer to the sweet spot than last shot."+(prev.move?" The last move ("+prev.move+") worked.":"")};
    else if(diff<-4)out.trend={good:false,text:"Further from the sweet spot than last shot."+(prev.move&&prev.move!=="hold the grind"?" Undo the last move ("+prev.move+").":"")};}}
  return out;
}

function wrapText(ctx,text,maxW){
  const words=String(text||"").split(/\s+/).filter(Boolean),lines=[];let line="";
  words.forEach(w=>{const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w;}else line=t;});
  if(line)lines.push(line);return lines;
}

const KNOWN_ORIGINS=["Ethiopia","Colombia","Kenya","Brazil","Guatemala","Costa Rica","Panama","Rwanda","Burundi","Honduras","Peru","El Salvador","Mexico","Indonesia","Yemen"];
function tasteGaps(beans,awayLog){
  const all=[...beans,...awayLog];
  const have=s=>all.some(b=>(b.origin||"").toLowerCase().includes(s.toLowerCase()));
  const originsMissing=KNOWN_ORIGINS.filter(o=>!have(o)).slice(0,8);
  const procsMissing=["Washed","Natural","Honey","Anaerobic","Co-ferment"].filter(p=>!all.some(b=>(b.process||"").toLowerCase().includes(p.toLowerCase())));
  const roastsMissing=ROAST_OPTS.filter(r=>!all.some(b=>(b.roast||"")===r));
  // Combos you rate low (origin + process), from beans with a rating of 5.5 or lower
  const lows={};
  all.filter(b=>b.rating>0&&b.rating<=5.5).forEach(b=>{const k=[(b.origin||"").trim(),(b.process||"").trim()].filter(Boolean).join(" · ");if(k){(lows[k]=lows[k]||[]).push(b.rating);}});
  const avoid=Object.entries(lows).map(([k,v])=>({k,avg:v.reduce((a,b)=>a+b,0)/v.length,n:v.length})).sort((a,b)=>a.avg-b.avg).slice(0,4);
  return{originsMissing,procsMissing,roastsMissing,avoid};
}
function tasteContext(beans,awayLog,rs,gaps){
  const line=b=>`${b.name} (${b.roaster||"?"}), ${b.origin||"?"}, ${b.process||"?"}, ${b.roast||"?"}, rated ${b.rating}/10${b.flavorProfile?", notes: "+b.flavorProfile:""}`;
  const loved=beans.filter(b=>b.rating>=8).sort((a,b)=>b.rating-a.rating).map(line);
  const mid=beans.filter(b=>b.rating>5.5&&b.rating<8).map(line);
  const disliked=beans.filter(b=>b.rating>0&&b.rating<=5.5).map(line);
  const away=awayLog.filter(a=>a.rating>0).map(a=>`${a.name} (${a.roaster||"?"}), ${a.origin||"?"}, ${a.process||"?"}, rated ${a.rating}/10${a.notes?", note: "+a.notes:""}`);
  const rr=rs.filter(r=>r.rated>0).slice(0,6).map(r=>`${r.k}: ${r.avg.toFixed(1)} avg over ${r.rated} rated`);
  const owned=beans.map(b=>`${b.name} (${b.roaster||"?"})`);
  return `LOVED (8+):\n${loved.join("\n")||"none yet"}\n\nMIDDLE:\n${mid.join("\n")||"none"}\n\nDISLIKED (5.5 or lower, learn what to AVOID):\n${disliked.join("\n")||"none"}\n\nTRIED ELSEWHERE:\n${away.join("\n")||"none"}\n\nROASTER AVERAGES:\n${rr.join("\n")||"none"}\n\nGAPS (never tried): origins ${gaps.originsMissing.join(", ")||"none"}; processes ${gaps.procsMissing.join(", ")||"none"}.\nALREADY OWNS (do not suggest these): ${owned.join("; ")}`;
}

const BEAN_KEYS=["roaster","name","origin","process","roast","altitude","varietal","flavorProfile","roastDate","imageUrl"];
function beanExtractPrompt(source){
  return`${source}

Extract the coffee bean details. Return ONLY one JSON object, no markdown and no commentary, exactly in this shape:
{"roaster":"","name":"","origin":"","process":"","roast":"","altitude":"","varietal":"","flavorProfile":"","roastDate":"","imageUrl":""}
Rules:
- Use "" for anything the page does not state. Never guess.
- roaster: the company selling the coffee. name: the coffee's own name, without the roaster's name and without size or grind words.
- origin: country or countries only, for example "Ethiopia" or "Colombia & Ethiopia" (put regions and farms elsewhere, not here).
- process: one of ${PROCESS_OPTS.join(", ")}. Use "Mixed" for blends of different processes.
- roast: one of ${ROAST_OPTS.join(", ")}.
- altitude like "2050m". varietal as listed. flavorProfile: the tasting notes, comma separated.
- roastDate as YYYY-MM-DD only if the page shows one.
- imageUrl only if a product image URL appears in the content, otherwise "".`;
}
function extractJsonObject(text){const m=String(text||"").match(/\{[\s\S]*\}/);if(!m)return null;try{return JSON.parse(m[0]);}catch(e){return null;}}
// Keep only non-empty fields and snap roast/process to the app's option lists so the dropdowns work.
function cleanBeanFields(r){
  const out={};
  BEAN_KEYS.forEach(k=>{const v=r&&r[k];if(typeof v==="string"&&v.trim()&&v.trim().toLowerCase()!=="n/a")out[k]=v.trim();});
  if(out.roast){const m=ROAST_OPTS.find(o=>o.toLowerCase()===out.roast.toLowerCase());if(m)out.roast=m;else delete out.roast;}
  if(out.process){
    const low=out.process.toLowerCase();
    const exact=PROCESS_OPTS.find(o=>o.toLowerCase()===low);
    const part=PROCESS_OPTS.filter(o=>o!=="Other"&&o!=="Mixed").find(o=>low.includes(o.toLowerCase()));
    out.process=exact||part||"Other";
  }
  return out;
}
const FETCH_ERRORS={
  url_not_allowed:"That site doesn't allow automated reading, or web fetch is switched off for your Anthropic organization.",
  url_not_accessible:"The site returned an error when I tried to open the page.",
  unsupported_content_type:"That link isn't a normal web page.",
  invalid_tool_input:"That doesn't look like a valid web address.",
  url_too_long:"That link is too long. Remove everything after the ? and try again.",
  too_many_requests:"Too many lookups at once. Wait a minute and try again.",
  max_uses_exceeded:"The lookup limit was reached. Try again.",
  unavailable:"The page reader had a temporary problem. Try again in a moment."
};
async function callClaudeFetchUrl(rawUrl){
  const key=window._COFFEE_API_KEY;
  if(!key)return{error:"No API key yet. Tap the gear icon to add your Anthropic API key.",code:"nokey"};
  let url=rawUrl.trim();
  if(!/^https?:\/\//i.test(url))url="https://"+url;
  if(url.length>250)url=url.split("#")[0].split("?")[0];
  const messages=[{role:"user",content:beanExtractPrompt("Open this coffee product page and read it.\n\nURL: "+url)}];
  try{
    let d=null;
    for(let turn=0;turn<3;turn++){
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,
          system:"You read coffee roaster product pages and extract structured bean details. Fetch the given URL, then answer with the JSON object only.",
          tools:[{type:"web_fetch_20250910",name:"web_fetch",max_uses:2,max_content_tokens:30000}],messages})});
      if(!res.ok){
        const t=await res.text();let msg=t;try{msg=JSON.parse(t).error.message;}catch(e){}
        return{error:"The page lookup was rejected ("+res.status+"): "+String(msg).slice(0,180),code:"api"};
      }
      d=await res.json();
      if(d.stop_reason==="pause_turn"){messages.push({role:"assistant",content:d.content});continue;}
      break;
    }
    const blocks=(d&&d.content)||[];
    const text=blocks.filter(b=>b.type==="text").map(b=>b.text||"").join("");
    const data=extractJsonObject(text);
    const cleaned=cleanBeanFields(data);
    if(cleaned.name||cleaned.roaster)return{data:cleaned};
    const errBlock=blocks.find(b=>b.type==="web_fetch_tool_result"&&b.content&&b.content.type==="web_fetch_tool_result_error");
    if(errBlock){const c=errBlock.content.error_code;return{error:FETCH_ERRORS[c]||"The page couldn't be read ("+c+").",code:c||"fetch"};}
    return{error:"I opened the page but couldn't find bean details on it. It may build its content with JavaScript.",code:"empty"};
  }catch(e){
    const m=e.message||String(e);
    if(m.includes("NetworkError")||m.includes("Failed to fetch")||m.includes("Load failed"))return{error:"Couldn't reach the Anthropic API. Check your connection.",code:"network"};
    return{error:"Error: "+m,code:"exception"};
  }
}

// Drag-to-pan, pinch/wheel-to-zoom crop frame. Position is stored as % offsets (0-100) of the
// image's own top-left within the frame, zoom as a scale multiplier — both saved on the bean.
function ImageCropBox({src,posX,posY,zoom,onChange}){
  const frameRef=useRef(null);
  const dragRef=useRef(null);
  const px=posX??50,py=posY??50,z=zoom??100;

  const clampAndSet=(nx,ny,nz)=>{
    const cx=Math.max(0,Math.min(100,nx));
    const cy=Math.max(0,Math.min(100,ny));
    const cz=Math.max(100,Math.min(300,nz));
    onChange({posX:cx,posY:cy,zoom:cz});
  };

  const startDrag=(clientX,clientY)=>{dragRef.current={startX:clientX,startY:clientY,origX:px,origY:py};};
  const moveDrag=(clientX,clientY)=>{
    if(!dragRef.current||!frameRef.current)return;
    const rect=frameRef.current.getBoundingClientRect();
    const dxPct=((clientX-dragRef.current.startX)/rect.width)*100;
    const dyPct=((clientY-dragRef.current.startY)/rect.height)*100;
    // Dragging the image right should reveal more of the left side, so invert.
    clampAndSet(dragRef.current.origX-dxPct,dragRef.current.origY-dyPct,z);
  };
  const endDrag=()=>{dragRef.current=null;};

  return<div className="crop-box-wrap">
    <div ref={frameRef} className="crop-box-frame"
      onMouseDown={e=>{e.preventDefault();startDrag(e.clientX,e.clientY);}}
      onMouseMove={e=>moveDrag(e.clientX,e.clientY)}
      onMouseUp={endDrag} onMouseLeave={endDrag}
      onTouchStart={e=>{const t=e.touches[0];startDrag(t.clientX,t.clientY);}}
      onTouchMove={e=>{const t=e.touches[0];moveDrag(t.clientX,t.clientY);}}
      onTouchEnd={endDrag}
      onWheel={e=>{e.preventDefault();clampAndSet(px,py,z+(e.deltaY<0?8:-8));}}
    >
      <img src={src} alt="Crop preview" draggable={false} style={{objectPosition:`${px}% ${py}%`,transform:`scale(${z/100})`}} onError={ev=>ev.target.style.opacity=0.15}/>
      <div className="crop-box-hint">Drag to reposition</div>
    </div>
    <div className="crop-box-zoom-row">
      <span className="crop-box-zoom-lbl">Zoom</span>
      <input type="range" min="100" max="300" value={z} onChange={e=>clampAndSet(px,py,parseInt(e.target.value))} className="img-adjust-slider"/>
      <button className="btn sm" onClick={()=>clampAndSet(50,50,100)}>Reset</button>
    </div>
  </div>;
}

        <button className="btn p sm" onClick={()=>commit()} style={{marginTop:6}}>Set</button>
      </div>}
      <button className="param-close" onClick={()=>{setOpen(false);setCustom(false);}}>✕</button>
    </div>}
  </div>;
}

function TimerModal({stages,onClose}){
  const[idx,setIdx]=useState(0);
  const[elapsed,setElapsed]=useState(0);
  const[running,setRunning]=useState(false);
  const[done,setDone]=useState(false);
  const ref=useRef(null);
  const stage=stages[idx];
  const total=stage?parseInt(stage.duration)||0:0;
  const remaining=Math.max(0,total-elapsed);
  useEffect(()=>{
    if(running&&!done){
      ref.current=setInterval(()=>{
        setElapsed(e=>{const n=e+1;if(n>=total){clearInterval(ref.current);if(idx<stages.length-1)setTimeout(()=>{setIdx(i=>i+1);setElapsed(0);setRunning(true);},600);else{setDone(true);setRunning(false);}return total;}return n;});
      },1000);
    }
    return()=>clearInterval(ref.current);
  },[running,idx,total,done]);
  const reset=()=>{clearInterval(ref.current);setIdx(0);setElapsed(0);setRunning(false);setDone(false);};
  const pct=total>0?(elapsed/total)*100:0;
  const mins=Math.floor(remaining/60),secs=remaining%60;
  return<div className="timer-overlay" onClick={onClose}>
    <div className="timer-modal" onClick={e=>e.stopPropagation()}>
      <div className="timer-stage-name">{done?"Done! ✓":stage?stage.name:""}</div>
      <div className="timer-stages-row">{stages.map((s,i)=><div key={i} className={"timer-pip"+(i===idx?" active":i<idx?" done":"")}>{s.name}</div>)}</div>
      <div className="timer-ring-wrap">
        <svg viewBox="0 0 120 120" className="timer-ring">
          <circle cx="60" cy="60" r="52" fill="none" stroke="var(--border)" strokeWidth="8"/>
          <circle cx="60" cy="60" r="52" fill="none" stroke={done?"var(--green)":"var(--gold)"} strokeWidth="8"
            strokeDasharray={`${2*Math.PI*52}`} strokeDashoffset={`${2*Math.PI*52*(1-pct/100)}`}
            strokeLinecap="round" style={{transform:"rotate(-90deg)",transformOrigin:"center",transition:"stroke-dashoffset 0.8s ease"}}/>
        </svg>
        <div className="timer-time">{done?"✓":`${mins}:${String(secs).padStart(2,"0")}`}</div>
      </div>
      {stage&&stage.action&&<div className="timer-action">{stage.action}</div>}
      <div className="timer-btns">
        {!running&&!done&&<button className="btn p" onClick={()=>setRunning(true)}>{elapsed>0?"Resume":"Start"}</button>}
        {running&&<button className="btn" onClick={()=>{clearInterval(ref.current);setRunning(false);}}>Pause</button>}
        <button className="btn" onClick={reset}>Reset</button>
        <button className="btn sm" onClick={onClose}>Close</button>
      </div>
    </div>
  </div>;
}

function Compass({onSelect,selected,zones,title,subtitle,axisTop,axisBottom}){
  const shape="25,8 95,8 75,92 5,92";
  return<div className="compass-wrap">
    <div className="compass-title">{title||"Espresso Compass"}</div>
    <div className="compass-sub">{subtitle||"Tap a numbered zone that matches your shot"}</div>

    <div style={{position:"relative",margin:"4px 0"}}>
      <svg viewBox="0 0 100 100" style={{width:"100%",height:"auto",display:"block"}}>
        <defs>
          <clipPath id="cc"><polygon points={shape}/></clipPath>
          <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stopColor="#c8c040" stopOpacity="0.45"/>
            <stop offset="45%" stopColor="#70b870" stopOpacity="0.55"/>
            <stop offset="100%" stopColor="#c86040" stopOpacity="0.45"/>

        </defs>
        <polygon points={shape} fill="url(#cg)"/>
        <polygon points={shape} fill="none" stroke="#5a4a30" strokeWidth="0.8"/>
        <line x1="33" y1="8" x2="13" y2="92" stroke="#3a2e22" strokeWidth="0.4" clipPath="url(#cc)"/>
        <line x1="63" y1="8" x2="43" y2="92" stroke="#3a2e22" strokeWidth="0.4" clipPath="url(#cc)"/>
        <line x1="25" y1="36" x2="95" y2="36" stroke="#3a2e22" strokeWidth="0.4" clipPath="url(#cc)"/>
        <line x1="15" y1="64" x2="85" y2="64" stroke="#3a2e22" strokeWidth="0.4" clipPath="url(#cc)"/>
        {zones.map(z=><g key={z.id} onClick={()=>onSelect(selected?.id===z.id?null:z)} style={{cursor:"pointer"}}>
          <circle cx={z.x} cy={z.y} r={selected?.id===z.id?6:4.6} fill={z.color}
            opacity={selected?.id===z.id?1:0.8}

          <text x={z.x} y={z.y} textAnchor="middle" dominantBaseline="central" fontSize={selected?.id===z.id?5:4} fontWeight="700" fill="#1a1410" style={{pointerEvents:"none"}}>
            {z.n}
          </text>
        </g>)}
      </svg>
    </div>
    <div className="compass-axis"><span>{(axisBottom&&axisBottom[0])||"Strong"}</span><span/><span>{(axisBottom&&axisBottom[1])||"Weak"}</span></div>
    <div className="compass-legend">
      {zones.map(z=><button key={z.id} className={"compass-legend-item"+(selected?.id===z.id?" sel":"")} onClick={()=>onSelect(selected?.id===z.id?null:z)}>
        <span className="compass-legend-dot" style={{background:z.color}}>{z.n}</span>{z.label}
      </button>)}
    </div>
    {selected&&<div className="compass-result">
      <div className="compass-result-label" style={{color:selected.color}}>{selected.label}</div>
      <div className="compass-result-desc">{selected.desc}</div>
      <div className="compass-result-fix"><span style={{color:"var(--gold)"}}>Action: </span>{selected.fix}</div>
    </div>}
  </div>;
}

    {info.roastProfile&&<div className="info-sec"><div className="info-lbl">Roast Profile</div><div className="info-txt">{info.roastProfile}</div></div>}
    {info.flavorNotes&&<div className="info-sec"><div className="info-lbl">Flavor Notes</div><div className="fpills">{info.flavorNotes.map((n,i)=><span key={i} className="fpill">{n}</span>)}</div></div>}

    </div>}
    {method==="moccamaster"&&<div className="fg">
      <Sel label="Dose" value={m.dose} onChange={u("dose")} options={DOSES_MOCCA}/>
      <Sel label="Water" value={m.water} onChange={u("water")} options={WATER_MOCCA}/>
      <Field label="Brew Time" value={m.totalTime} onChange={u("totalTime")} placeholder="e.g. 6:00"/>
      <div className="field full"><div className="sec-txt" style={{fontSize:12}}>Ratio {ratioStr(m.dose,m.water)} (Moccamaster recommends about 1:16.7, or 60g per liter)</div></div>
      <div className="field full"><Field label="Tasting Notes" value={m.notes} onChange={u("notes")} multiline/></div>
      <div className="field full"><Field label="What Worked" value={m.whatWorked} onChange={u("whatWorked")} multiline/></div>
      <div className="field full"><Field label="What Didn't" value={m.whatDidnt} onChange={u("whatDidnt")} multiline/></div>
    </div>}
    <div className="fa" style={{paddingBottom:40}}>
      <button className="btn p" onClick={adding?saveNew:saveEdit}>{adding?"Save Bean":"Save"}</button>
      <button className="btn" onClick={()=>{if(adding){setAdding(false);setShowList(true);}else setEditing(false);}}>Cancel</button>
    </div>
  </div>;
}

  const updDraftM=(f,v)=>setDraft(d=>({...d,methods:{...d.methods,[method]:{...d.methods[method],[f]:v}}}));

  const saveGrind=()=>{const e={...grindDraft,id:Date.now(),date:grindDraft.date||new Date().toLocaleDateString()};upd(bs=>bs.map(b=>b.id===selId?{...b,grindLogs:{...b.grindLogs,[method]:[...(b.grindLogs[method]||[]),e]}}:b));setAddingGrind(false);setGrindDraft({position:{whole:0,dot:0},note:"",date:""});};
  const delGrind=gid=>upd(bs=>bs.map(b=>b.id===selId?{...b,grindLogs:{...b.grindLogs,[method]:b.grindLogs[method].filter(g=>g.id!==gid)}}:b));

  const saveRecipe=text=>{const r={id:Date.now(),date:new Date().toLocaleDateString(),text};upd(bs=>bs.map(b=>b.id===selId?{...b,savedRecipes:{...b.savedRecipes,[method]:[...(b.savedRecipes?.[method]||[]),r]}}:b));};

  const applyRecipe=text=>{
    const g=pats=>{for(const p of pats){const m=text.match(p);if(m)return m[1];}return null;};
    if(method==="aeropress"){
      const dose=g([/dose[:\s]+(\d+(?:\.\d+)?)\s*g/i]);
      const water=g([/water[:\s]+(\d+)\s*g/i,/(\d+)\s*g\s*water/i]);
      const temp=g([/(\d+(?:\.\d+)?)\s*°?F/i]);
      const steep=g([/steep[:\s]+(\d+)\s*s/i]);
      const press=g([/press[:\s]+(\d+)\s*s/i]);
      const bloom=g([/bloom.*?(\d+)\s*s/i]);
      if(dose)updM("dose",dose);if(water)updM("water",Math.min(220,parseInt(water)).toString());
      if(temp)updM("temp",temp);if(steep)updM("steepTime",steep);if(press)updM("pressTime",press);
      if(bloom){updM("bloom",true);updM("bloomTime",bloom);}
    }else if(method==="pourover"){
      const dose=g([/dose[:\s]+(\d+(?:\.\d+)?)\s*g/i]);
      const water=g([/water[:\s]+(\d+)\s*g/i]);
      const temp=g([/(\d+(?:\.\d+)?)\s*°?F/i]);
      const bloom=g([/bloom[:\s]+(\d+)\s*g/i]);
      const bloomT=g([/bloom.*?(\d+)\s*s/i]);

      updM("pours",text);
    }else if(method==="moccamaster"){
      const dose=g([/dose[:\s]+(\d+(?:\.\d+)?)\s*g/i]);
      const water=g([/water[:\s]+(\d+)\s*(?:ml|g)/i,/(\d+)\s*(?:ml|g)\s*water/i]);
      const total=text.match(/(?:brew|total)[^\n]*?(\d+:\d+)/i)?.[1];
      if(dose)updM("dose",dose);if(water)updM("water",water);if(total)updM("totalTime",total);

  const importFromText=(rawIn)=>{

    // Legacy plain-text export format (from before full JSON export existed).
    try{
      const lines=raw.split("\n");
      const newBeans=[];let cur=null;
      for(const line of lines){
        const t=line.trim();
        if(!t||t==="────")continue;
        if(t.includes(" — ")&&!t.startsWith(" ")&&!t.startsWith("Esp")&&!t.startsWith("Aero")&&!t.startsWith("Pour")){

        }else if(cur&&t.includes("|")){const ps=t.split("|").map(s=>s.trim());if(ps.length>=2){cur.origin=ps[0];cur.process=ps[1];if(ps[2])cur.roast=ps[2];}}
        else if(cur&&t.startsWith("Espresso:")){const m=t.match(/Espresso:\s*([\d.]+)g\s*->\s*([\d.]+)g\s*\/\s*([\d.]+)s\s*\/\s*([\d.]+(?:\.[\d]+)?)F/);if(m){cur.methods.espresso.dose=m[1];cur.methods.espresso.yield=m[2];cur.methods.espresso.time=m[3];cur.methods.espresso.temp=m[4];}}
        else if(cur&&t.startsWith("AeroPress:")){const m=t.match(/AeroPress:\s*([\d.]+)g\s*\/\s*([\d.]+)g\s*\/\s*([\d.]+)F\s*\/\s*Steep\s*([\d.]+)s/);if(m){cur.methods.aeropress.dose=m[1];cur.methods.aeropress.water=m[2];cur.methods.aeropress.temp=m[3];cur.methods.aeropress.steepTime=m[4];}}
        else if(cur&&t.startsWith("Roast Date:")){cur.roastDate=t.replace("Roast Date:","").trim();}

        else if(cur&&t.startsWith("  Worked:")&&!cur._lastMethod){cur.methods.espresso.whatWorked=t.replace("  Worked:","").trim();}
      }
      if(cur)newBeans.push(cur);
      if(newBeans.length===0){setImportStatus("No beans found. Check format.");return;}
      upd(bs=>[...bs,...newBeans.filter(nb=>!bs.some(b=>b.name===nb.name&&b.roaster===nb.roaster))]);

        `Read this coffee bag label/photo and extract as much as you can identify. Leave a field as empty string "" if not visible or not stated on the bag. Return JSON exactly in this shape:\n{"roaster":"","name":"","origin":"","process":"","roast":"","altitude":"","varietal":"","flavorProfile":"","roastDate":""}\nFor roast, use one of: Light, Light-Medium, Medium, Medium-Dark, Dark — infer from any roast description if not explicit. For roastDate, use YYYY-MM-DD format if a date is visible, else leave empty.`,
        dataUrl,true
      );

      else setPhotoImport({error:"Couldn't read the label clearly. Try a closer, well-lit photo, or fill in manually."});

        "You read coffee bag labels and menu boards and extract structured info. Return ONLY valid JSON, no markdown, no explanation.",
        `Read this coffee bag label or cafe menu/board photo and extract what you can identify. Leave a field as empty string "" if not visible or not stated. Return JSON exactly in this shape:\n{"name":"","roaster":"","origin":"","process":"","roast":"","flavorProfile":""}\nFor roast, use one of: Light, Light-Medium, Medium, Medium-Dark, Dark — infer from description if not explicit.`,
        dataUrl,true

  const runDiagnosis=async(followup)=>{
    if(!followup&&!diagInput.trim()&&!compass&&!tastes.length)return;

    const tStr=shotTime?shotTime+"s":(md.time?md.time+"s (logged)":"unknown");

    const cCtx=compass?` Compass: ${compass.label} — ${compass.desc}.`:"";

      ?`Bean:${cur.name}(${cur.roaster}),${cur.origin},${cur.process},${cur.roast}. Setup:${md.dose}g/${md.temp}°F/grind ${grindLabel(lg?.position)}/pre-brew ${md.preBrew}. THIS SHOT:time=${tStr},yield=${yStr}.${slow}${fast}${cCtx}`

    {screen==="discovery"&&<div className="screen-body">

        {(()=>{
          const ratedBeans=beans.filter(b=>b.rating>0).map(b=>({name:b.name,rating:b.rating}));
          const ratedAway=awayLog.filter(a=>a.rating>0).map(a=>({name:a.name,rating:a.rating}));
          const allRated=[...ratedBeans,...ratedAway];
          const totalTried=beans.length+awayLog.length;
          const avgRating=allRated.length?(allRated.reduce((s,b)=>s+b.rating,0)/allRated.length):null;
          const topBean=[...allRated].sort((a,b)=>b.rating-a.rating)[0];
          // Each tried item keeps enough info for the drill-down list: name, roaster, rating, and where it came from.
          const allTried=[
            ...beans.map(b=>({name:b.name,roaster:b.roaster,origin:b.origin,process:b.process,roast:b.roast,rating:b.rating||0,source:"Your Beans"})),
            ...awayLog.map(a=>({name:a.name,roaster:a.roaster,origin:a.origin,process:a.process,roast:a.roast,rating:a.rating||0,source:"Tasting Log"})),

          const groupBy=(field,sortByRating)=>{
            const map={};

          };

                  const dash=frac*C;
                  const gap=C-dash;
                  const offset=-cumulative*C;
                  cumulative+=frac;
                  return<circle key={r.k} cx="18" cy="18" r={R} fill="none" stroke={palette[i%palette.length]} strokeWidth="4" strokeDasharray={`${dash} ${gap}`} strokeDashoffset={offset} transform="rotate(-90 18 18)" style={{cursor:"pointer"}} onClick={()=>onSelect(r)}/>;

                      <span className="rank-lbl">{r.k}</span>
                      <span className="rank-n">{r.n} {r.n===1?"bean":"beans"}{r.limited?" · limited data":""}</span>

                {rStats.length>8&&<div style={{fontSize:11,color:"var(--muted)",marginTop:6}}>Top 8 of {rStats.length} roasters. Ranked with a small-sample adjustment, so one great bean does not outrank a roaster you have rated many times.</div>}

              </div>
            </>}
            {discoveryDrill&&<div className="modal-overlay" onClick={()=>setDiscoveryDrill(null)}>
              <div className="modal" onClick={e=>e.stopPropagation()}>
                <h2>{discoveryDrill.k}</h2>

                {discoveryDrill.key&&<p style={{marginTop:4}}>{discoveryDrill.inStock} in stock{discoveryDrill.best?` · best: ${discoveryDrill.best.name} (${discoveryDrill.best.rating.toFixed(1)})`:""}{discoveryDrill.worst?` · lowest: ${discoveryDrill.worst.name} (${discoveryDrill.worst.rating.toFixed(1)})`:""}</p>}
                <div className="gl" style={{marginTop:10}}>
                  {[...discoveryDrill.items].sort((a,b)=>(b.rating||0)-(a.rating||0)).map((item,i)=><div key={i} className="ge">
                    <div>
                      <div className="ge-pos" style={{fontSize:15,letterSpacing:0}}>{item.name}</div>
                      <div className="ge-date">{item.roaster||"—"} · {item.source}</div>

                  {discoveryDrill.key&&<button className="btn" onClick={()=>{setRenameDlg({key:discoveryDrill.key,from:discoveryDrill.k,to:discoveryDrill.k});setDiscoveryDrill(null);}}>Rename</button>}
                  <button className="btn" onClick={()=>setDiscoveryDrill(null)}>Close</button>
                </div>
              </div>
            </div>}
          </>;
        })()}
        <div className="div"/>
        <div className="sec-lbl" style={{marginBottom:6}}>Find Beans to Try</div>

            {(gaps.originsMissing.length>0||gaps.procsMissing.length>0)&&<div style={{marginBottom:10}}><div className="sec-lbl" style={{marginBottom:6}}>Not tried yet</div>{[...gaps.procsMissing,...gaps.originsMissing.slice(0,6)].map(g=><span key={g} className="gap-pill">{g}</span>)}</div>}

          <div className="fa" style={{marginTop:10}}>
            <button className="btn p sm" onClick={addAway}>Save</button>
            <button className="btn sm" onClick={()=>{setAddingAway(false);setAwayPhotoImport(null);setAwayCapturedPhoto(null);}}>Cancel</button>
          </div>
        </div>}
        {awayLog.length===0&&!addingAway&&<div className="empty-grind">Nothing logged yet</div>}
        <div className="gl" style={{marginTop:awayLog.length?12:0}}>
          {awayLog.map(a=><div key={a.id} className="ge">
            <div>
              <div className="ge-pos" style={{fontSize:15,letterSpacing:0}}>{a.name}</div>
              <div className="ge-date">{[a.roaster,a.place].filter(Boolean).join(" · ")} {a.date&&"· "+a.date}</div>
              {(a.origin||a.process||a.roast)&&<div className="ge-note">{[a.origin,a.process,a.roast].filter(Boolean).join(" | ")}</div>}
              {a.flavorProfile&&<div className="ge-note">{a.flavorProfile}</div>}
              {a.notes&&<div className="ge-note">{a.notes}</div>}
              {a.rating>0&&<div className="bc-rating" style={{marginTop:4}}>{"★".repeat(Math.round(a.rating/2))} {a.rating}/10</div>}
            </div>
            <button className="btn d sm" onClick={()=>delAway(a.id)}>✕</button>
          </div>)}
        </div>
      </div>
    </div>}

    {kioskMode&&<div className="kiosk-view">
      <div className="kiosk-hdr"><h1>Coffee Bar</h1><button className="btn sm" onClick={()=>setKioskMode(false)}>Exit Display</button></div>
      <div className="kiosk-grid">
        {sortedBeans.filter(b=>b.inStock!==false).map(b=>{
          const img=b.imageBase64||b.imageUrl;
          return<div key={b.id} className={"kiosk-card"+(b.currentlyBrewing?" brewing":"")} onClick={()=>{setSelId(b.id);setKioskMode(false);setScreen("beans");setShowList(false);}}>
            <div className="kiosk-card-img">{img?<img src={img} alt={b.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:"☕"}</div>
            <div className="kiosk-card-body">
              <div className="kiosk-card-name">{b.name}</div>
              <div className="kiosk-card-roaster">{b.roaster}</div>
              <div className="kiosk-card-meta">{[b.origin,b.process,b.roast].filter(Boolean).join(" · ")}</div>
              {b.flavorProfile&&<div className="kiosk-card-flavor">{b.flavorProfile}</div>}
              {b.rating>0&&<div className="bc-rating">{"★".repeat(Math.round(b.rating/2))} {b.rating}/10</div>}
              {b.currentlyBrewing&&<div className="bc-badge brewing" style={{display:"inline-block",marginTop:6}}>Brewing Now</div>}
            </div>
          </div>;
        })}
      </div>
    </div>}

    {showTimer&&<TimerModal stages={timerStages} onClose={()=>setShowTimer(false)}/>}

    {showApiModal&&<div className="modal-overlay" onClick={()=>setShowApiModal(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>API Key</h2>
        <p>Required for AI features. Stored on this device only.</p>
        <p>Get your key at <strong>console.anthropic.com</strong></p>
        {window._COFFEE_API_KEY?<p style={{color:"var(--green)",marginBottom:8,fontSize:11}}>✓ Key active: {window._COFFEE_API_KEY.slice(0,14)}...</p>:<p style={{color:"var(--red)",marginBottom:8,fontSize:11}}>✗ No key saved</p>}
        <input type="text" placeholder="sk-ant-api03-..." value={apiKeyInput} onChange={e=>setApiKeyInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveApiKey()}/>
        <div className="fa" style={{marginBottom:12}}>
          <button className="btn p" onClick={saveApiKey}>Save Key</button>
          <button className="btn" onClick={()=>setShowApiModal(false)}>Cancel</button>
        </div>
        <div style={{borderTop:"1px solid var(--border)",paddingTop:12}}>
          <button className="btn ai" style={{width:"100%"}} onClick={async()=>{window._COFFEE_API_KEY=apiKeyInput.trim()||window._COFFEE_API_KEY;const r=await callClaude("You are a helpful assistant.","Say only: API key working!");alert(r);}}>Test Connection</button>
        </div>
      </div>
    </div>}

    {cardDlg&&cur&&<BrewCardModal bean={cur} method={cardDlg} dialed={cur.dialed?.[cardDlg]} onClose={()=>setCardDlg(null)}/>}
    {cleanupDlg&&<div className="modal-overlay" onClick={()=>setCleanupDlg(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>Merge roaster names</h2>
        <p>Tap the spelling to keep. Every bean from that roaster gets it.</p>
        <div style={{marginTop:12}}>
          {rGroups.filter(g=>g.mixed).map(g=><div key={g.key} style={{marginBottom:14}}>
            <div className="sec-lbl" style={{marginBottom:6}}>{g.n} entries</div>
            <div className="tchips">{g.variants.map(v=><button key={v} className={"tchip"+(cleanupDlg[g.key]===v?" on":"")} onClick={()=>setCleanupDlg(c=>({...c,[g.key]:v}))}>{v}</button>)}</div>
          </div>)}
          {rGroups.filter(g=>g.mixed).length===0&&<div className="sec-txt" style={{fontSize:13}}>Nothing to merge.</div>}
        </div>
        <div className="fa" style={{marginTop:6}}>
          <button className="btn p" disabled={rGroups.filter(g=>g.mixed).length===0} onClick={applyCleanup}>Merge all</button>
          <button className="btn" onClick={()=>setCleanupDlg(null)}>Cancel</button>
        </div>
      </div>
    </div>}
    {renameDlg&&<div className="modal-overlay" onClick={()=>setRenameDlg(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>Rename roaster</h2>
        <p>Changes the name on every bean and tasting log entry from {renameDlg.from}.</p>
        <input style={{width:"100%",marginTop:12,background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",fontFamily:"'DM Mono',monospace",fontSize:16,padding:"10px 12px",outline:"none",borderRadius:0}} value={renameDlg.to} onChange={e=>setRenameDlg(r=>({...r,to:e.target.value}))} autoCapitalize="words"/>
        <div className="fa" style={{marginTop:12}}>
          <button className="btn p" disabled={!renameDlg.to.trim()} onClick={applyRename}>Rename</button>
          <button className="btn" onClick={()=>setRenameDlg(null)}>Cancel</button>
        </div>
      </div>
    </div>}

    {freezerDlg&&cur&&<div className="modal-overlay" onClick={()=>setFreezerDlg(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>❄ Freezer</h2>
        <p>While beans are frozen their age stops counting. When you take some out, the age picks up from where it stopped. {cur.roastDate?"Roasted "+fmtDate(cur.roastDate)+".":"Add a roast date to this bean so the age can be worked out."}</p>
        <div className="field"><label>Frozen on</label><input type="date" value={freezerDlg.frozenOn} onChange={e=>setFreezerDlg(d=>({...d,frozenOn:e.target.value}))}/></div>
        <div className="field" style={{marginTop:10}}><label>Taken out on (leave blank if still frozen)</label><input type="date" value={freezerDlg.thawedOn} onChange={e=>setFreezerDlg(d=>({...d,thawedOn:e.target.value}))}/></div>
        <p style={{fontSize:12,marginTop:8}}>Pulling a new portion later? Open this again and set Taken out to that day.</p>
        {freezerDlg.frozenOn&&(()=>{const preview=effectiveAge({roastDate:cur.roastDate,frozenOn:freezerDlg.frozenOn,thawedOn:freezerDlg.thawedOn});return preview===null?null:<p style={{color:"var(--green)",fontSize:13}}>{freezerDlg.thawedOn?"Counts as "+preview+" days of age right now.":"Frozen at "+preview+" days of age."}</p>;})()}
        <div className="fa" style={{marginTop:10,flexWrap:"wrap"}}>
          <button className="btn p" onClick={saveFreezer}>Save</button>
          {freezerDlg.frozenOn&&!freezerDlg.thawedOn&&<button className="btn" onClick={()=>setFreezerDlg(d=>({...d,thawedOn:todayISO()}))}>Take out today</button>}
          {(cur.frozenOn||cur.frozen)&&<button className="btn d" onClick={clearFreezer}>Clear</button>}
          <button className="btn" onClick={()=>setFreezerDlg(null)}>Cancel</button>
        </div>
      </div>
    </div>}

    {showImportModal&&<div className="modal-overlay" onClick={()=>setShowImportModal(false)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>Import Beans</h2>
        <p>Paste exported bean data below — includes images and every field. Beans already in your collection (same name + roaster) will be skipped.</p>
        <label className="btn p" style={{display:"inline-block",marginBottom:10}}>
          Choose Backup File
          <input type="file" accept=".txt,.json,text/plain,application/json" style={{display:"none"}} onChange={readBackupFile}/>
        </label>
        <p style={{fontSize:12}}>Or paste text below.</p>
        <textarea value={importText} onChange={e=>setImportText(e.target.value)} placeholder="Paste exported text here..." style={{width:"100%",height:140,background:"var(--bg3)",border:"1px solid var(--border)",color:"var(--text)",fontFamily:"'DM Mono',monospace",fontSize:13,padding:"10px 12px",outline:"none",resize:"none",borderRadius:0,marginBottom:12,WebkitAppearance:"none",display:"block"}}/>
        {importStatus&&<p style={{color:importStatus.includes("Error")||importStatus.includes("No beans")?"var(--red)":"var(--green)",marginBottom:10}}>{importStatus}</p>}
        <div className="fa">
          <button className="btn p" onClick={()=>importFromText()} disabled={!importText.trim()}>Import</button>
          <button className="btn" onClick={()=>{setShowImportModal(false);setImportText("");setImportStatus("");}}>Cancel</button>
        </div>
      </div>
    </div>}

    <div className={"toast"+(copied?" show":"")}>Copied!</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
